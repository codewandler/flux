# The narrow authorization for an automated release cut (C-251, `examples/release.flux`).
#
# This is the authority an unattended release run should hold and nothing more: write exactly the
# three release changelogs, execute exactly the two release scripts, read the workspace, and invoke a
# model. No network, no secrets, no other process, no other write.
#
# ⚠ STATUS — read before relying on this file.
#
# `flux flow run` does NOT install this as its floor today. `flux-cli` composes `[[policy.grants]]`
# **additively** on top of `flux_policy::default_local_grants()`
# (`crates/flux-cli/src/execution.rs:1419`), and that floor already grants `workspace.write` on
# `path: "*"`. Adding grants can only widen an already-wide floor; it cannot narrow it. Installing
# this file as a *replacement* floor needs a surface that can do so — a `--policy` flag on the CLI, or
# an embedded run via `flux_sdk::FlowClient::builder().with_authorization(...)`, which replaces rather
# than merges. That is deliberately a separate change: it is a new lever on the safety envelope and
# deserves its own review.
#
# So what protects the release flow *today* is structural in the op set instead, and does not depend
# on this file at all:
#   * the program calls no `bash`, `proc.run`, `write`, `edit`, `patch` or `append`
#     (`crates/flux-eval/tests/release_authority.rs`);
#   * `release_verify_versions` and `release_cut` have FIXED argv — the two scripts below and nothing
#     else, with no program name taken from a caller;
#   * `changelog_insert` resolves its target through flux-system's canonicalizing IO boundary and
#     refuses any path outside the three files below;
#   * the `release-scribe` role declares `tools: []`, so the model holds no write op to attempt.
#
# This file is still checked in, and tested, for two reasons: `flux policy simulate
# .flux/policies/release.toml` reads exactly this shape today, and
# `the_checked_in_release_policy_grants_exactly_the_three_changelogs_and_two_scripts` pins its
# contents against `WRITABLE_CHANGELOGS`/`RELEASE_SCRIPTS` so it cannot drift from the code while it
# waits to be wired.
#
# Two notes on the matcher, both load-bearing:
#   * Paths are LITERAL. `flux_policy`'s `*` matches any run of characters *including* `/`, so
#     `path = "website/docs/*"` would also match `website/docs/../../src/main.rs`-shaped requests
#     after normalization surprises. Exactness is the only way to mean exactly three files.
#   * `requires_approval` is left FALSE on purpose. `true` escalates to the approver, and an
#     unattended run's approver is `--yes` (allow-everything) — an approval escalation in CI is an
#     allow. Authority must therefore be granted or absent, never deferred.

# ── Write: exactly the three release changelogs ─────────────────────────────────
# `WHATS-NEW.md` is the customer changelog and `website/docs/whats-new.md` is its tested mirror
# (`website_customer_changelog_is_in_sync`), regenerated by `scripts/cut-release.sh` in the release
# commit — a bare `WHATS-NEW.md` edit reds the gate until it is.
[[policy.grants]]
subjects = [{ kind = "user", id = "release" }]
resources = [{ kind = "path", path = "CHANGELOG.md" }]
actions = ["workspace.write"]
requires_approval = false

[[policy.grants]]
subjects = [{ kind = "user", id = "release" }]
resources = [{ kind = "path", path = "WHATS-NEW.md" }]
actions = ["workspace.write"]
requires_approval = false

[[policy.grants]]
subjects = [{ kind = "user", id = "release" }]
resources = [{ kind = "path", path = "website/docs/whats-new.md" }]
actions = ["workspace.write"]
requires_approval = false

# ── Read: only what the host needs to decide the version ───────────────────────
# `Cargo.toml` is where the current version comes from; the changelogs are read before they are
# rewritten. Nothing else in the tree needs to be readable for a cut.
[[policy.grants]]
subjects = [{ kind = "user", id = "release" }]
resources = [
  { kind = "path", path = "Cargo.toml" },
  { kind = "path", path = "CHANGELOG.md" },
  { kind = "path", path = "WHATS-NEW.md" },
  { kind = "path", path = "website/docs/whats-new.md" },
]
actions = ["workspace.read"]
requires_approval = false

# ── Execute: git, plus exactly the two release scripts ─────────────────────────
# `release_verify_versions` and `release_cut` report their script as their permission subject and
# `release_plan` reports `git`, so a process request for any other program has no grant and is denied
# by default. `git` is here because reading the commit log IS the host's version evidence; the ops
# only ever run read-only git subcommands (`describe`, `rev-list`, `log`, `diff`) — the mutating half
# of a release (commit, tag) is inside `scripts/cut-release.sh`, which is transactional.
[[policy.grants]]
subjects = [{ kind = "user", id = "release" }]
resources = [{ kind = "process", id = "git" }]
actions = ["process.exec"]
requires_approval = false

[[policy.grants]]
subjects = [{ kind = "user", id = "release" }]
resources = [{ kind = "process", id = "scripts/check-crate-versions.sh" }]
actions = ["process.exec"]
requires_approval = false

[[policy.grants]]
subjects = [{ kind = "user", id = "release" }]
resources = [{ kind = "process", id = "scripts/cut-release.sh" }]
actions = ["process.exec"]
requires_approval = false

# ── Invoke: the scribe, and only the scribe ────────────────────────────────────
# The `task` op's authority requirement is provider invocation named by the role. The scribe itself
# holds `tools: []`, so this grant buys a text completion and nothing else.
[[policy.grants]]
subjects = [{ kind = "user", id = "release" }]
resources = [{ kind = "provider", id = "release-scribe" }]
actions = ["model.invoke"]
requires_approval = false
