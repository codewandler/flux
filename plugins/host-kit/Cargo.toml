[package]
name = "codewandler-flux-host-kit"
edition.workspace = true
rust-version.workspace = true
# On the PROTOCOL LINE (C-143), not the flux workspace version: host-kit is the plugin-side SDK
# over `codewandler-flux-plugin-protocol`, so its version answers "which wire does a plugin built
# against it speak?" — a question flux releases do not change the answer to. The former lockstep
# (bumped by scripts/cut-release.sh on every cut) republished it unchanged every release and forced
# a plugin-pack rebuild for wire-irrelevant reasons.
# 1.2.0 (D-241/D-242): additive guarded WebSocket connect/read/close and bounded HTTP-response-to-
# blob helpers over protocol 1.3.0. Existing plugin helper signatures and behavior remain stable.
# 1.1.0 (C-312): the wire moved (protocol 1.1.1 -> 1.2.0, adding `OperationSpec::platform`), and
# this is the version that answers "which wire does a plugin built against this speak?" — so it
# moves with it. Additive on both counts: `PlatformSourcing` joins the re-exported protocol
# vocabulary, and `read_op`/`write_op`/`internal_op` keep their signatures and produce the same
# spec, now letting `OperationSpec`'s own `Default` fill what they do not name.
# 1.1.0 (C-311, same unpublished wire): `OperationSpec::reaches` joins it, and `VendorReach` joins
# the re-exported vocabulary. Additive again — an op that says nothing about vendor reach
# serializes byte-identically to one written before the field existed.
version = "1.2.0"
license.workspace = true
description = "Shared SDK for flux integration plugins: typed host-capability calls (secret-by-purpose, http+bearer, endpoint, datasource records) + a manifest/op builder over the flux plugin wire protocol"
repository = "https://github.com/codewandler/flux"

[lib]
name = "host_kit"

[dependencies]
flux-plugin-protocol.workspace = true
flux-datasource.workspace = true
flux-spec.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
base64.workspace = true
schemars.workspace = true
