[package]
name = "codewandler-flux-host-kit"
edition.workspace = true
rust-version.workspace = true
# On the PROTOCOL LINE (C-143), not the flux workspace version: host-kit is the plugin-side SDK
# over `codewandler-flux-plugin-protocol`, so its version answers "which wire does a plugin built
# against it speak?" — a question flux releases do not change the answer to. The former lockstep
# (bumped by scripts/cut-release.sh on every cut) republished it unchanged every release and forced
# a plugin-pack rebuild for wire-irrelevant reasons.
version = "1.0.0"
license.workspace = true
description = "Shared SDK for flux integration plugins: typed host-capability calls (secret-by-purpose, http+bearer, endpoint, datasource records) + a manifest/op builder over the flux plugin wire protocol"
repository = "https://github.com/codewandler/flux"

[lib]
name = "host_kit"

[dependencies]
flux-plugin-protocol.workspace = true
flux-datasource.workspace = true
flux-spec.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
base64.workspace = true
schemars.workspace = true
