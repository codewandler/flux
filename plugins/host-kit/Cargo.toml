[package]
name = "codewandler-flux-host-kit"
edition.workspace = true
rust-version.workspace = true
# Own version line, decoupled from the plugin-pack workspace version: this crate releases to
# crates.io whenever the SDK surface (or its flux dep line) changes, not per pack cut. Successor to
# the misnamed `codewandler-host-kit` (0.1.0, built against the flux 0.10 line, yanked).
version = "0.2.0"
license.workspace = true
description = "Shared SDK for flux integration plugins: typed host-capability calls (secret-by-purpose, http+bearer, endpoint, datasource records) + a manifest/op builder over flux-plugin's guest protocol"
repository = "https://github.com/codewandler/flux"

[lib]
name = "host_kit"

[dependencies]
flux-plugin.workspace = true
flux-datasource.workspace = true
flux-spec.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
schemars.workspace = true
