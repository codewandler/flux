[package]
name = "codewandler-flux-host-kit"
edition.workspace = true
rust-version.workspace = true
# LOCKSTEP with the flux workspace version (not the plugin-pack version): scripts/cut-release.sh
# bumps this file on every flux cut, so each release publishes a host-kit whose version — and flux
# dep line — matches the flux crates exactly (host-kit X.Y.Z is compatible with flux X.Y.Z, by
# construction). An independent version line (0.2.x → flux 0.13, the short-lived 0.3.0 → 0.14)
# silently froze whenever nothing remembered to bump it; the predecessor `codewandler-host-kit`
# 0.1.0 (flux 0.10 line) is yanked.
version = "0.16.0"
license.workspace = true
description = "Shared SDK for flux integration plugins: typed host-capability calls (secret-by-purpose, http+bearer, endpoint, datasource records) + a manifest/op builder over flux-plugin's guest protocol"
repository = "https://github.com/codewandler/flux"

[lib]
name = "host_kit"

[dependencies]
flux-plugin.workspace = true
flux-datasource.workspace = true
flux-spec.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
schemars.workspace = true
