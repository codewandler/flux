# The flux integration plugin pack (story D-08) — a NESTED workspace, excluded from the root flux
# workspace (see ../Cargo.toml `exclude`). Each plugin is a subprocess binary speaking flux's
# plugin protocol; heavy vendor deps live here, not in the main flux gate. Build/test with
# `cargo build` / `cargo test` from this directory.
[workspace]
resolver = "2"
members = [
    "host-kit",
    "websearch",
    "gitlab",
    "jira",
    "confluence",
    "kubernetes",
    "loki",
    "prometheus",
    "slack",
    # fluxplane-plugins parity — observability/AI pack (D-15) + telephony/infra HTTP (D-16/D-17)
    "alertmanager",
    "grafana",
    "opsgenie",
    "huggingface",
    "aws",
    "homer",
    # conn-wave (D-16 sql/docker + D-17 asterisk) — hand-rolled wire clients over the host-kit ConnStream
    "sql",
    "docker",
    "asterisk",
    # secret-management plugins (D-85/D-86)
    "vault",
    "onepassword",
    # release tooling (D-46) — NOT a plugin: generates the signed pack-release index
    "pack-index",
]

[workspace.package]
edition = "2021"
rust-version = "1.87"
# The PACK version — the plugin binaries' distribution version, independent of both flux and the
# 1.x protocol line. 0.1.2 is the first pack built after the wire contract moved into its own crate
# (C-141/C-142): plugins no longer compile flux-lang or flux's host half, and host-kit now publishes
# from this release rather than the flux closure (C-146).
version = "0.1.2"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# The flux PROTOCOL LINE (C-143): caret requirements on the 1.x wire contract, not on flux's
# version. A flux release does not move these, so `scripts/cut-release.sh` never edits this file
# and a plugin binary is rebuilt only when the wire itself changes. Path deps keep local
# development working against the sibling crates.
flux-plugin-protocol = { package = "codewandler-flux-plugin-protocol", version = "1", path = "../crates/flux-plugin-protocol" }
flux-datasource = { package = "codewandler-flux-datasource", version = "1", path = "../crates/flux-datasource" }
flux-secret = { package = "codewandler-flux-secret", version = "1", path = "../crates/flux-secret" }
flux-spec = { package = "codewandler-flux-spec", version = "1", path = "../crates/flux-spec" }
host-kit = { package = "codewandler-flux-host-kit", version = "1", path = "host-kit" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
base64 = "0.23"
schemars = "1.2.2"
