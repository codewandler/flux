# The flux integration plugin pack (story D-08) — a NESTED workspace, excluded from the root flux
# workspace (see ../Cargo.toml `exclude`). Each plugin is a subprocess binary speaking flux's
# plugin protocol; heavy vendor deps live here, not in the main flux gate. Build/test with
# `cargo build` / `cargo test` from this directory.
[workspace]
resolver = "2"
members = [
    "host-kit",
    "websearch",
    "gitlab",
    "jira",
    "confluence",
    "kubernetes",
    "loki",
    "prometheus",
    "slack",
    # fluxplane-plugins parity — observability/AI pack (D-15) + telephony/infra HTTP (D-16/D-17)
    "alertmanager",
    "grafana",
    "opsgenie",
    "huggingface",
    "aws",
    "homer",
    # conn-wave (D-16 sql/docker + D-17 asterisk) — hand-rolled wire clients over the host-kit ConnStream
    "sql",
    "docker",
    "asterisk",
    # secret-management plugins (D-85/D-86)
    "vault",
    "onepassword",
    # release tooling (D-46) — NOT a plugin: generates the signed pack-release index
    "pack-index",
]

# The PACK version below is the plugin binaries' distribution version, independent of both flux and
# the 1.x protocol line. 0.1.3 carries the MySQL/MariaDB half of D-196…D-198: the host learned the
# MySQL handshake in flux 0.30.1, but the `COM_QUERY` client and the dialect-aware introspection ops
# live in `sql/` and ship only from here, so a flux release alone leaves a host that can authenticate
# to MariaDB talking to a plugin that cannot query it. The wire contract did not move, so host-kit
# stays at 1.0.0 and its publish step is a no-op.
#
# Keep `version` within the first few lines of the section: release-plugins.yml reads it from a
# bounded window after the section header, and a comment between the two hid it once already.
[workspace.package]
edition = "2021"
rust-version = "1.87"
version = "0.1.4"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# The flux PROTOCOL LINE (C-143): caret requirements on the 1.x wire contract, not on flux's
# version. A flux release does not move these, so `scripts/cut-release.sh` never edits this file
# and a plugin binary is rebuilt only when the wire itself changes. Path deps keep local
# development working against the sibling crates.
# Pinned to the protocol MINOR, not bare `^1`. host-kit's published dependency requirement is what
# `scripts/check-host-kit-protocol-drift.sh` reads to answer "which wire does a plugin built against
# this host-kit actually speak" — and `^1` records a floor of 1.0.0, so it keeps reporting drift no
# matter how often the pack is republished. Bump this alongside the protocol crate's MINOR.
flux-plugin-protocol = { package = "codewandler-flux-plugin-protocol", version = "1.1", path = "../crates/flux-plugin-protocol" }
flux-datasource = { package = "codewandler-flux-datasource", version = "1", path = "../crates/flux-datasource" }
flux-secret = { package = "codewandler-flux-secret", version = "1", path = "../crates/flux-secret" }
flux-spec = { package = "codewandler-flux-spec", version = "1", path = "../crates/flux-spec" }
host-kit = { package = "codewandler-flux-host-kit", version = "1", path = "host-kit" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
base64 = "0.23"
schemars = "1.2.2"
