# The flux integration plugin pack (story D-08) — a NESTED workspace, excluded from the root flux
# workspace (see ../Cargo.toml `exclude`). Each plugin is a subprocess binary speaking flux's
# plugin protocol; heavy vendor deps live here, not in the main flux gate. Build/test with
# `cargo build` / `cargo test` from this directory.
[workspace]
resolver = "2"
members = [
    "host-kit",
    "websearch",
    "gitlab",
    "jira",
    "confluence",
    "kubernetes",
    "loki",
    "prometheus",
    "slack",
    # fluxplane-plugins parity — observability/AI pack (D-15) + telephony/infra HTTP (D-16/D-17)
    "alertmanager",
    "grafana",
    "opsgenie",
    "huggingface",
    "aws",
    "homer",
    # conn-wave (D-16 sql/docker + D-17 asterisk) — hand-rolled wire clients over the host-kit ConnStream
    "sql",
    "docker",
    "asterisk",
    # secret-management plugins (D-85/D-86)
    "vault",
    "onepassword",
    # release tooling (D-46) — NOT a plugin: generates the signed pack-release index
    "pack-index",
]

[workspace.package]
edition = "2021"
rust-version = "1.85"
version = "0.1.1"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# flux contracts (path deps into the sibling crates; these are L0/L4 and pure of vendor deps)
flux-plugin = { package = "codewandler-flux-plugin", version = "0.17.1", path = "../crates/flux-plugin" }
flux-datasource = { package = "codewandler-flux-datasource", version = "0.17.1", path = "../crates/flux-datasource" }
flux-secret = { package = "codewandler-flux-secret", version = "0.17.1", path = "../crates/flux-secret" }
flux-spec = { package = "codewandler-flux-spec", version = "0.17.1", path = "../crates/flux-spec" }
host-kit = { package = "codewandler-flux-host-kit", version = "0.17.1", path = "host-kit" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
schemars = "1.2.1"
