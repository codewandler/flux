# Flux-Lang editor support for Helix (`hx`) — config only, no extension needed.
#
# Server (diagnostics, completion, hover, :format): install once with `task install` (installs
# `flux` and `flux-lsp` to ~/.cargo/bin) or `cargo install --path crates/flux-lsp`, or point
# `command` at a built binary (e.g. `target/debug/flux-lsp` after `cargo build -p flux-lsp`).
#
# Highlighting: install/update the pinned grammar and matching queries with the idempotent command
# at https://codewandler.github.io/flux/docs/language/editors. Helix colours via tree-sitter only;
# it does not render LSP semantic tokens.
#
# This repo-local file is merged over your global `~/.config/helix/languages.toml`.

# Limit `hx --grammar fetch/build` run from this checkout to the one custom grammar declared here.
use-grammars = { only = ["flux"] }

[language-server.flux-lsp]
command = "flux-lsp"

[[language]]
name = "flux"
scope = "source.flux"
file-types = ["flux"]
comment-token = "#"
indent = { tab-width = 2, unit = "  " }
language-servers = ["flux-lsp"]

[[grammar]]
name = "flux"
# Immutable revision containing the tested parser, queries, and Helix installer.
source = { git = "https://github.com/codewandler/flux-tree-sitter", rev = "29cff6c992b706a4a18009f4335e81101416671a" }
