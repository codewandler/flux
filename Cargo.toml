[workspace]
resolver = "2"
members = [
    "crates/flux-core",
    "crates/flux-policy",
    "crates/flux-secret",
    "crates/flux-spec",
    "crates/flux-config",
    "crates/flux-provider",
    "crates/flux-system",
    "crates/flux-runtime",
    "crates/flux-tools",
    "crates/flux-events",
    "crates/flux-skill",
    "crates/flux-agent",
    "crates/flux-orchestrate",
    "crates/flux-lang",
    "crates/flux-flow",
    "crates/flux-eval",
    "crates/flux-plugin",
    "crates/flux-plugin-protocol",
    "crates/flux-providers",
    "crates/flux-credentials",
    "crates/flux-sdk",
    "crates/flux-auth",
    "crates/flux-evidence",
    "crates/flux-datasource",
    "crates/flux-a2a",
    "crates/flux-pg",
    "crates/flux-server",
    "crates/flux-capabilities",
    "crates/flux-web",
    "crates/flux-tui",
    "crates/flux-cli",
    "crates/flux-codegate",
    "crates/flux-cognition",
    "crates/flux-app",
    "crates/flux-markdown",
    "crates/flux-channels",
    "crates/flux-audio",
    "crates/flux-lsp",
]
# `plugins/` is its own nested cargo workspace (the integration plugin pack, D-08): subprocess binaries
# with heavy vendor deps (k8s client, cloud SDKs) kept OUT of the main flux gate. Built separately.
exclude = ["plugins"]

[workspace.package]
edition = "2021"
version = "0.54.3"
license = "MIT OR Apache-2.0"
repository = "https://github.com/codewandler/flux"
homepage = "https://github.com/codewandler/flux"
# 1.87: required by the resvg/usvg 0.47 rasterizer stack (flux-tools `png` feature, L-78).
rust-version = "1.87"

[workspace.dependencies]
# internal
#
# Crates in the `flux-sdk` publish closure carry a `version` alongside `path`: cargo uses the path for
# local builds and the version in the *published* manifest, so `cargo publish` can resolve them from
# crates.io. Keep these versions in lockstep with `[workspace.package].version` on every release (see
# crates/flux-sdk/PUBLISHING.md). Crates NOT in the closure stay path-only — they are not published.
flux-core = { package = "codewandler-flux-core", version = "0.54.3", path = "crates/flux-core" }
flux-policy = { package = "codewandler-flux-policy", version = "1", path = "crates/flux-policy" }
# `1.2`, not `1`: `flux-plugin`'s credential boundary (C-312) calls `Redactor::credential_shape` and
# the now-public `names_a_secret`/`is_opaque_material`, which do not exist before 1.2.0. A bare `1`
# lets a downstream consumer resolve 1.0.x and fail to compile the published crate.
flux-secret = { package = "codewandler-flux-secret", version = "1.2", path = "crates/flux-secret" }
flux-spec = { package = "codewandler-flux-spec", version = "1", path = "crates/flux-spec" }
flux-config = { package = "codewandler-flux-config", version = "0.54.3", path = "crates/flux-config" }
flux-system = { package = "codewandler-flux-system", version = "0.54.3", path = "crates/flux-system" }
flux-runtime = { package = "codewandler-flux-runtime", version = "0.54.3", path = "crates/flux-runtime" }
flux-tools = { package = "codewandler-flux-tools", version = "0.54.3", path = "crates/flux-tools" }
# `default-features = false` here, and NOT because the SQLite backend is unwanted — it IS the default
# for anyone depending on the published crate (C-274). It is off at the workspace level because a
# member's own `default-features = false` is silently IGNORED for a workspace-inherited dependency
# (measured on cargo 1.97: `cargo metadata` still reports `uses_default_features: true`), and
# `flux-flow` — the portable engine core — has to be able to shed the driver. So every member that
# needs the embedded backend asks for it: `flux-events = { workspace = true, features = ["sqlite"] }`.
# flux-flow instead re-enables it through its OWN default-on `sqlite` feature, which is what makes
# `cargo build -p codewandler-flux-flow --no-default-features` a rusqlite-free graph.
flux-events = { package = "codewandler-flux-events", version = "0.54.3", path = "crates/flux-events", default-features = false }
flux-agent = { package = "codewandler-flux-agent", version = "0.54.3", path = "crates/flux-agent" }
flux-skill = { package = "codewandler-flux-skill", version = "0.54.3", path = "crates/flux-skill" }
flux-orchestrate = { package = "codewandler-flux-orchestrate", version = "0.54.3", path = "crates/flux-orchestrate" }
flux-lang = { package = "codewandler-flux-lang", version = "0.54.3", path = "crates/flux-lang" }
flux-lsp = { package = "codewandler-flux-lsp", version = "0.54.3", path = "crates/flux-lsp" }
flux-flow = { package = "codewandler-flux-flow", version = "0.54.3", path = "crates/flux-flow" }
flux-eval = { path = "crates/flux-eval" }
flux-plugin = { package = "codewandler-flux-plugin", version = "0.54.3", path = "crates/flux-plugin", default-features = false, features = ["host", "hooks", "pack"] }
# The plugin wire contract. Versioned independently from flux; 2.0 removes the retired
# Asterisk-only WebSocket grant (D-249).
flux-plugin-protocol = { package = "codewandler-flux-plugin-protocol", version = "2.0.0", path = "crates/flux-plugin-protocol" }
flux-auth = { package = "codewandler-flux-auth", version = "0.54.3", path = "crates/flux-auth" }
# `1.1`, not `1`. `flux-runtime` calls `EvidenceLog::{set_max_payload_bytes,
# retained_payload_bytes, compaction_notice}`, which exist only from 1.1.0 — so a bare `"1"` lets a
# consumer resolve 1.0.0 and then fail to compile *inside this workspace's own published source*.
# It cannot happen here (the path dependency is 1.1.0) and it cannot happen on a fresh resolve
# (which picks the newest 1.x); it bites exactly the trees that already hold a lockfile pinning
# 1.0.0 — i.e. every existing downstream host. Measured against 0.41.0 from flux-connectors' C-192.
flux-evidence = { package = "codewandler-flux-evidence", version = "1.1", path = "crates/flux-evidence" }
flux-datasource = { package = "codewandler-flux-datasource", version = "1", path = "crates/flux-datasource" }
flux-a2a = { package = "codewandler-flux-a2a", version = "0.54.3", path = "crates/flux-a2a" }
flux-pg = { package = "codewandler-flux-pg", version = "0.54.3", path = "crates/flux-pg" }
flux-server = { package = "codewandler-flux-server", version = "0.54.3", path = "crates/flux-server" }
flux-capabilities = { package = "codewandler-flux-capabilities", version = "0.54.3", path = "crates/flux-capabilities" }
flux-web = { package = "codewandler-flux-web", version = "0.54.3", path = "crates/flux-web" }
flux-sdk = { package = "codewandler-flux-sdk", version = "0.54.3", path = "crates/flux-sdk" }
flux-tui = { path = "crates/flux-tui" }
flux-provider = { package = "codewandler-flux-provider", version = "0.54.3", path = "crates/flux-provider" }
flux-providers = { package = "codewandler-flux-providers", version = "0.54.3", path = "crates/flux-providers" }
flux-credentials = { package = "codewandler-flux-credentials", version = "0.54.3", path = "crates/flux-credentials" }
flux-cognition = { package = "codewandler-flux-cognition", version = "0.54.3", path = "crates/flux-cognition" }
flux-app = { package = "codewandler-flux-app", version = "0.54.3", path = "crates/flux-app" }
flux-markdown = { package = "codewandler-flux-markdown", version = "0.54.3", path = "crates/flux-markdown" }
flux-channels = { package = "codewandler-flux-channels", version = "0.54.3", path = "crates/flux-channels" }

# external
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Provider-native calls are validated against the exact operation schema before a staged gather
# dispatch or action proposal can enter a Flux plan. Remote schema retrieval is deliberately off:
# operation schemas must be self-contained, deterministic contracts.
jsonschema = { version = "0.49", default-features = false }
serde_norway = "0.9"
schemars = "1.2.2"
rowan = "0.16.1"
text-size = "1.1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
futures = "0.3"
futures-util = "0.3"
bytes = "1"
async-trait = "0.1"
async-stream = "0.3"
# reqwest 0.13's `rustls` feature bundles the TLS backend + platform trust store (via
# rustls-platform-verifier). reqwest 0.13.2 removed the separate `webpki-roots` feature/dep, so
# requesting it capped the whole graph at 0.13.1; `rustls` alone is the supported rustls path.
# 0.13 also moved `RequestBuilder::form` behind the new `form` feature (flux-credentials/flux-auth
# post OAuth token/introspection requests as form bodies).
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "form", "rustls"] }
eventsource-stream = "0.2"
# `env` lets flag definitions own their env-var fallbacks (e.g. `flux a2a --token` ⇦ FLUX_A2A_TOKEN)
# so precedence is declared once at the arg instead of hand-rolled in each handler.
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
# Held at 0.29/0.28 (range reqs so `task deps:upgrade` skips them): markdown-ratatui
# (codewandler/markdown, git-pinned below in flux-markdown) requires ratatui ^0.29 — bumping here
# would split ratatui into two incompatible versions at the flux-markdown seam. crossterm must
# match ratatui's backend, and flux-tui's ansi-to-tui 7 tracks ratatui 0.29. Lift all three
# together once codewandler/markdown moves to ratatui 0.30.
ratatui = ">=0.29, <0.30"
crossterm = ">=0.28, <0.29"
toml = "1.1"
cargo_metadata = "0.23.1"
syn = { version = "3", features = ["full", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
base64 = "0.23"
sha2 = "0.11"
hmac = "0.13"
hex = "0.4"
regex = "1"
similar = "3"
rand = "0.10"
# 0.40's libsqlite3-sys build script uses cfg_select!, which is newer than this workspace's 1.87
# MSRV. Keep the bundled database on the last compatible line until upstream declares that floor.
rusqlite = { version = "0.39", features = ["bundled"] }
ulid = "3"
# Postgres backend (`flux-pg`, opt-in behind `postgres` features): the default build stays
# rusqlite-only and DB-free. `default-features = false` + no sqlx macros so a build never needs a
# live database; `tls-rustls` avoids an OpenSSL system dep. `percent-encoding` decodes DSN userinfo.
# sqlx 0.9 requires Rust 1.94. The 0.8 line supports this workspace's declared 1.87 MSRV.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres"] }
percent-encoding = "2"
rquickjs = "0.12"
axum = "0.8"
axum-server = { version = "0.8", features = ["tls-rustls"] }
cron = "0.17"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# The historical `<2.18` cap (2.18+ needed a then-unpublished `signal-hook-tokio ^0.4`) is lifted:
# signal-hook-tokio 0.4.0 shipped, so the socket-mode (`hyper`) feature resolves again on latest.
slack-morphism = "2.24"
url = "2"
tracing = "0.1"
# Language server (flux-lsp): tower-lsp bundles lsp-types + the async JSON-RPC stdio loop.
tower-lsp = "0.20"
# Plugin pack distribution (D-47): verify the minisign-signed `plugins-index.json`
# (`minisign-verify` is pure Rust, zero dependencies) and unpack the per-target archives
# (`tar` + `lzma-rs` for `.tar.xz` on unix/macOS targets, `zip` for `.zip` on the windows target).
# `tar` is already resolved in the lockfile (an `ort-sys`/`fastembed` transitive, gated behind the
# optional `local-embeddings` feature) — declaring it directly adds no new crate to the build.
minisign-verify = "0.2"
tar = "0.4"
lzma-rs = "0.3"
# zip 8 requires Rust 1.88; 7 keeps plugin archives available at the workspace's 1.87 MSRV.
zip = { version = "7", default-features = false, features = ["deflate"] }
# Dev-only: signs fixtures in flux-plugin's hermetic pack tests (production signing happens in CI
# via the real `minisign` CLI against a keypair generated once with this crate's own generator —
# see `crates/flux-plugin/src/pack.rs`'s `generate_pack_keypair`).
minisign = "0.9"

[profile.release]
opt-level = 3
lto = "thin"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
