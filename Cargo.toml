[workspace]
resolver = "2"
members = [
    "crates/flux-core",
    "crates/flux-policy",
    "crates/flux-secret",
    "crates/flux-spec",
    "crates/flux-config",
    "crates/flux-provider",
    "crates/flux-system",
    "crates/flux-runtime",
    "crates/flux-tools",
    "crates/flux-events",
    "crates/flux-skill",
    "crates/flux-agent",
    "crates/flux-orchestrate",
    "crates/flux-lang",
    "crates/flux-flow",
    "crates/flux-eval",
    "crates/flux-plugin",
    "crates/flux-providers",
    "crates/flux-credentials",
    "crates/flux-sdk",
    "crates/flux-auth",
    "crates/flux-evidence",
    "crates/flux-datasource",
    "crates/flux-a2a",
    "crates/flux-pg",
    "crates/flux-server",
    "crates/flux-capabilities",
    "crates/flux-web",
    "crates/flux-tui",
    "crates/flux-cli",
    "crates/flux-codegate",
    "crates/flux-cognition",
    "crates/flux-app",
    "crates/flux-markdown",
    "crates/flux-channels",
    "crates/flux-audio",
    "crates/flux-lsp",
]
# `plugins/` is its own nested cargo workspace (the integration plugin pack, D-08): subprocess binaries
# with heavy vendor deps (k8s client, cloud SDKs) kept OUT of the main flux gate. Built separately.
exclude = ["plugins"]

[workspace.package]
edition = "2021"
version = "0.14.6"
license = "MIT OR Apache-2.0"
repository = "https://github.com/codewandler/flux"
homepage = "https://github.com/codewandler/flux"
rust-version = "1.85"

[workspace.dependencies]
# internal
#
# Crates in the `flux-sdk` publish closure carry a `version` alongside `path`: cargo uses the path for
# local builds and the version in the *published* manifest, so `cargo publish` can resolve them from
# crates.io. Keep these versions in lockstep with `[workspace.package].version` on every release (see
# crates/flux-sdk/PUBLISHING.md). Crates NOT in the closure stay path-only — they are not published.
flux-core = { package = "codewandler-flux-core", version = "0.14.6", path = "crates/flux-core" }
flux-policy = { package = "codewandler-flux-policy", version = "0.14.6", path = "crates/flux-policy" }
flux-secret = { package = "codewandler-flux-secret", version = "0.14.6", path = "crates/flux-secret" }
flux-spec = { package = "codewandler-flux-spec", version = "0.14.6", path = "crates/flux-spec" }
flux-config = { path = "crates/flux-config" }
flux-system = { package = "codewandler-flux-system", version = "0.14.6", path = "crates/flux-system" }
flux-runtime = { package = "codewandler-flux-runtime", version = "0.14.6", path = "crates/flux-runtime" }
flux-tools = { package = "codewandler-flux-tools", version = "0.14.6", path = "crates/flux-tools" }
flux-events = { package = "codewandler-flux-events", version = "0.14.6", path = "crates/flux-events" }
flux-agent = { package = "codewandler-flux-agent", version = "0.14.6", path = "crates/flux-agent" }
flux-skill = { package = "codewandler-flux-skill", version = "0.14.6", path = "crates/flux-skill" }
flux-orchestrate = { package = "codewandler-flux-orchestrate", version = "0.14.6", path = "crates/flux-orchestrate" }
flux-lang = { package = "codewandler-flux-lang", version = "0.14.6", path = "crates/flux-lang" }
flux-flow = { package = "codewandler-flux-flow", version = "0.14.6", path = "crates/flux-flow" }
flux-eval = { path = "crates/flux-eval" }
flux-plugin = { package = "codewandler-flux-plugin", version = "0.14.6", path = "crates/flux-plugin" }
flux-auth = { path = "crates/flux-auth" }
flux-evidence = { package = "codewandler-flux-evidence", version = "0.14.6", path = "crates/flux-evidence" }
flux-datasource = { package = "codewandler-flux-datasource", version = "0.14.6", path = "crates/flux-datasource" }
flux-a2a = { package = "codewandler-flux-a2a", version = "0.14.6", path = "crates/flux-a2a" }
flux-pg = { package = "codewandler-flux-pg", version = "0.14.6", path = "crates/flux-pg" }
flux-server = { path = "crates/flux-server" }
flux-capabilities = { package = "codewandler-flux-capabilities", version = "0.14.6", path = "crates/flux-capabilities" }
# Path-only / unpublished (the flux-eval precedent): only flux-cli consumes it, so it stays out of
# the crates.io closure — no `version`, and not listed in scripts/publish-crates-io.sh. If a
# published crate ever depends on it, add a `version` and the publish entry then.
flux-web = { package = "codewandler-flux-web", path = "crates/flux-web" }
flux-sdk = { package = "codewandler-flux-sdk", version = "0.14.6", path = "crates/flux-sdk" }
flux-tui = { path = "crates/flux-tui" }
flux-provider = { package = "codewandler-flux-provider", version = "0.14.6", path = "crates/flux-provider" }
flux-providers = { package = "codewandler-flux-providers", version = "0.14.6", path = "crates/flux-providers" }
flux-credentials = { package = "codewandler-flux-credentials", version = "0.14.6", path = "crates/flux-credentials" }
flux-cognition = { package = "codewandler-flux-cognition", version = "0.14.6", path = "crates/flux-cognition" }
flux-app = { path = "crates/flux-app" }
flux-markdown = { package = "codewandler-flux-markdown", version = "0.14.6", path = "crates/flux-markdown" }
flux-channels = { path = "crates/flux-channels" }
flux-audio = { package = "codewandler-flux-audio", version = "0.14.6", path = "crates/flux-audio" }

# external
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
schemars = "1.2.1"
rowan = "0.16.1"
text-size = "1.1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
futures = "0.3"
futures-util = "0.3"
bytes = "1"
async-trait = "0.1"
async-stream = "0.3"
# reqwest 0.13's `rustls` feature bundles the TLS backend + platform trust store (via
# rustls-platform-verifier). reqwest 0.13.2 removed the separate `webpki-roots` feature/dep, so
# requesting it capped the whole graph at 0.13.1; `rustls` alone is the supported rustls path.
# 0.13 also moved `RequestBuilder::form` behind the new `form` feature (flux-credentials/flux-auth
# post OAuth token/introspection requests as form bodies).
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "form", "rustls"] }
eventsource-stream = "0.2"
# `env` lets flag definitions own their env-var fallbacks (e.g. `flux a2a --token` ⇦ FLUX_A2A_TOKEN)
# so precedence is declared once at the arg instead of hand-rolled in each handler.
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
# Held at 0.29/0.28 (range reqs so `task deps:upgrade` skips them): markdown-ratatui
# (codewandler/markdown, git-pinned below in flux-markdown) requires ratatui ^0.29 — bumping here
# would split ratatui into two incompatible versions at the flux-markdown seam. crossterm must
# match ratatui's backend, and flux-tui's ansi-to-tui 7 tracks ratatui 0.29. Lift all three
# together once codewandler/markdown moves to ratatui 0.30.
ratatui = ">=0.29, <0.30"
crossterm = ">=0.28, <0.29"
toml = "1.1"
base64 = "0.22"
sha2 = "0.11"
sha1 = "0.11"
hmac = "0.13"
hex = "0.4"
regex = "1"
similar = "3"
rand = "0.10"
rusqlite = { version = "0.40", features = ["bundled"] }
ulid = "1"
# Postgres backend (`flux-pg`, opt-in behind `postgres` features): the default build stays
# rusqlite-only and DB-free. `default-features = false` + no sqlx macros so a build never needs a
# live database; `tls-rustls` avoids an OpenSSL system dep. `percent-encoding` decodes DSN userinfo.
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres"] }
percent-encoding = "2"
rquickjs = "0.12"
axum = "0.8"
cron = "0.17"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# The historical `<2.18` cap (2.18+ needed a then-unpublished `signal-hook-tokio ^0.4`) is lifted:
# signal-hook-tokio 0.4.0 shipped, so the socket-mode (`hyper`) feature resolves again on latest.
slack-morphism = "2.22"
url = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Language server (flux-lsp): tower-lsp bundles lsp-types + the async JSON-RPC stdio loop.
tower-lsp = "0.20"
# Plugin pack distribution (D-47): verify the minisign-signed `plugins-index.json`
# (`minisign-verify` is pure Rust, zero dependencies) and unpack the per-target archives
# (`tar` + `lzma-rs` for `.tar.xz` on unix/macOS targets, `zip` for `.zip` on the windows target).
# `tar` is already resolved in the lockfile (an `ort-sys`/`fastembed` transitive, gated behind the
# optional `local-embeddings` feature) — declaring it directly adds no new crate to the build.
minisign-verify = "0.2"
tar = "0.4"
lzma-rs = "0.3"
zip = { version = "8", default-features = false, features = ["deflate"] }
# Dev-only: signs fixtures in flux-plugin's hermetic pack tests (production signing happens in CI
# via the real `minisign` CLI against a keypair generated once with this crate's own generator —
# see `crates/flux-plugin/src/pack.rs`'s `generate_pack_keypair`).
minisign = "0.9"

[profile.release]
opt-level = 3
lto = "thin"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
