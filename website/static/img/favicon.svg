<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">flux</title>
  <desc id="desc">Three plan rails cross a signal-green execution gate and resolve into one output.</desc>
  <!--
    Square favicon framing of assets/flux-mark.svg. The mark is 216x113 in its own
    units; it is centred here with even clear space. Unlike the in-page logos (which
    ship as explicit -light/-dark files so they follow the site's theme toggle), this
    one keys off prefers-color-scheme on purpose: it renders in browser chrome, which
    follows the OS scheme rather than the site.
  -->
  <style>
    .ink { fill: #141a18; }
    .signal { fill: #0bbf83; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #f2f6f4; }
      .signal { fill: #2be6a5; }
    }
  </style>
  <g transform="translate(24 58.2) scale(0.963)">
    <path class="ink" d="M0 16h45c21 0 35 6 50 21l25 25v25L80 51c-9-8-18-11-33-11H0z"/>
    <path class="ink" d="M0 62h88v24H0z"/>
    <path class="ink" d="M0 108h47c15 0 24-3 33-11l40-36v25l-25 25c-15 15-29 21-50 21H0z"/>
    <path class="signal" d="M132 50h22v79h-22z"/>
    <path class="ink" d="M166 62h30l20 24-20 24h-30z"/>
  </g>
</svg>
