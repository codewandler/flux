# Plugin pack release channel (D-46, docs/designs/plugin-distribution.md).
#
# Hand-written on purpose — cargo-dist is NOT extended to the plugins workspace (dist models one
# app per package; 17 lockstep packages would collide with the core release series). Deliberately
# `workflow_dispatch`, NOT a tag push: the dist-generated release.yml triggers on the tag glob
# '**[0-9]+.[0-9]+.[0-9]+*', which any semver-ish plugins tag would also match and red-X dist's
# plan job. This workflow creates the `plugins-v<version>` tag + release itself via GITHUB_TOKEN
# (workflow-created refs don't re-trigger workflows, so no recursion). Do NOT hand-push a
# `plugins-v*` tag.
#
# Secrets: MINISIGN_SECRET_KEY — the contents of a PASSWORDLESS minisign secret key
# (`minisign -G -W`); its public half is embedded in the flux binary (D-47). Required to publish;
# a dry run without it skips signing with a notice.

name: release-plugins

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Pack version to release (must equal plugins/ workspace.package.version)"
        required: true
        type: string
      publish:
        description: "Create the plugins-v<version> tag + GitHub release (false = dry run: artifacts only)"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-plugins
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          # macos-13 is retired (jobs starve waiting for a runner); macos-15-intel is the
          # current Intel-mac label — the same one dist's core release resolves to.
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-latest
            target: aarch64-apple-darwin
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # The requested version must be the plugins workspace's lockstep version — the index, the
      # archive names, and the manifests all report it; a mismatch here would ship lies.
      - name: Verify version input matches the plugins workspace
        shell: bash
        run: |
          # Read the whole [workspace.package] section, not a fixed-size window: `grep -A5` missed
          # `version` the moment a comment was added above it, and the run failed on a manifest that
          # was perfectly correct.
          ws_version="$(awk '/^\[workspace\.package\]/{p=1;next} /^\[/{p=0} p' plugins/Cargo.toml \
            | sed -nE 's/^version *= *"([^"]+)".*/\1/p' | head -1)"
          if [ "${ws_version}" != "${{ inputs.version }}" ]; then
            echo "::error::input version '${{ inputs.version }}' != plugins workspace.package.version '${ws_version}' — bump plugins/Cargo.toml first"
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          # `master` pins the action's code to a commit (C-187). `stable` moves by design, so keep
          # selecting it explicitly — and it is a required input at this SHA, since the ref no
          # longer carries the toolchain.
          toolchain: stable

      - name: Cache cargo (plugins)
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: plugins

      - name: Build the pack (release)
        working-directory: plugins
        run: cargo build --release --workspace

      # One archive per plugin per target, containing just the binary:
      # flux-plugin-<name>-<version>-<target>.tar.xz (.zip on windows, binary keeps its .exe).
      - name: Package per-plugin archives
        shell: bash
        run: |
          set -euo pipefail
          version="${{ inputs.version }}"
          target="${{ matrix.target }}"
          mkdir -p out
          shopt -s nullglob
          count=0
          if [[ "${target}" == *windows* ]]; then
            for bin in plugins/target/release/flux-plugin-*.exe; do
              name="$(basename "${bin}" .exe)"           # flux-plugin-<name>
              # cd into the binary dir so the zip holds the bare .exe, not the path hierarchy
              (cd "$(dirname "${bin}")" && 7z a -bso0 "${GITHUB_WORKSPACE}/out/${name}-${version}-${target}.zip" "${name}.exe")
              count=$((count + 1))
            done
          else
            for bin in plugins/target/release/flux-plugin-*; do
              [ -f "${bin}" ] && [ -x "${bin}" ] || continue
              case "${bin}" in *.d) continue ;; esac
              name="$(basename "${bin}")"                # flux-plugin-<name>
              archive="out/${name}-${version}-${target}.tar.xz"
              tar -cJf "${archive}" -C "$(dirname "${bin}")" "${name}"
              count=$((count + 1))
            done
          fi
          echo "packaged ${count} plugin archives for ${target}"
          [ "${count}" -gt 0 ] || { echo "::error::no flux-plugin-* binaries found"; exit 1; }
          ls -l out/

      - name: Upload leg artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pack-${{ matrix.target }}
          path: out/*
          if-no-files-found: error

  assemble:
    name: assemble · index · sign${{ inputs.publish && ' · release' || ' (dry run)' }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          # `master` pins the action's code to a commit (C-187). `stable` moves by design, so keep
          # selecting it explicitly — and it is a required input at this SHA, since the ref no
          # longer carries the toolchain.
          toolchain: stable

      - name: Cache cargo (plugins)
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: plugins

      - name: Collect all leg artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: pack-*
          path: dist
          merge-multiple: true

      # The index is generated by the unit-tested pack-index tool (plugins/pack-index), never by
      # inline YAML. --expect-* is the sanity gate: asset count = plugins × targets, and every
      # index entry names a file that exists in dist/ (the index is built FROM dist/, so an entry
      # that names a missing asset cannot occur; a missing build leg fails the count).
      - name: Generate plugins-index.json (sanity-gated)
        working-directory: plugins
        run: |
          expected_plugins="$(grep -rl '^name = "flux-plugin-' ./*/Cargo.toml | wc -l)"
          echo "expecting ${expected_plugins} plugins x 5 targets"
          cargo run --release -p pack-index -- \
            --version "${{ inputs.version }}" \
            --dir ../dist \
            --out ../dist/plugins-index.json \
            --released-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --expect-plugins "${expected_plugins}" \
            --expect-targets 5
          cat ../dist/plugins-index.json

      # One minisign signature covers every artifact transitively via the per-artifact sha256
      # entries (the terraform sign-the-aggregate pattern). Publishing without the key is refused;
      # a dry run without it proceeds unsigned with a loud notice.
      - name: Sign the index (minisign)
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          if [ -z "${MINISIGN_SECRET_KEY}" ]; then
            if [ "${{ inputs.publish }}" = "true" ]; then
              echo "::error::MINISIGN_SECRET_KEY secret is not set — cannot publish an unsigned pack"
              exit 1
            fi
            echo "::notice::MINISIGN_SECRET_KEY not set — dry run proceeds UNSIGNED"
            exit 0
          fi
          sudo apt-get update -q && sudo apt-get install -y -q minisign
          umask 077
          printf '%s\n' "${MINISIGN_SECRET_KEY}" > "${RUNNER_TEMP}/minisign.key"
          minisign -S -s "${RUNNER_TEMP}/minisign.key" \
            -m dist/plugins-index.json -x dist/plugins-index.json.minisig \
            -t "flux plugin pack v${{ inputs.version }}"
          rm -f "${RUNNER_TEMP}/minisign.key"
          minisign -V >/dev/null 2>&1 || true
          test -s dist/plugins-index.json.minisig

      # Dry run: everything the release would carry, as a workflow artifact — no tag, no release.
      - name: Upload dry-run bundle
        if: ${{ !inputs.publish }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plugins-release-${{ inputs.version }}-dry-run
          path: dist/*
          if-no-files-found: error

      # --latest=false keeps releases/latest/download/flux-cli-installer.sh resolving to a CORE
      # release; gh creates the plugins-v tag itself at the workflow's commit.
      - name: Create the plugins-v release
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -s dist/plugins-index.json.minisig || { echo "::error::unsigned index"; exit 1; }
          gh release create "plugins-v${{ inputs.version }}" dist/* \
            --latest=false \
            --target "${GITHUB_SHA}" \
            --title "flux plugin pack v${{ inputs.version }}" \
            --notes "Prebuilt \`flux-plugin-*\` binaries for the five core targets, plus the minisign-signed \`plugins-index.json\`. Install with \`flux plugin install <name>\` (D-47). This release series is consumed by the flux CLI — it is not the flux core release."

      # host-kit ships HERE, not with the flux closure (C-146). It is the plugin-side SDK on the
      # 1.x protocol line, so a flux release has nothing to say about its version — publishing it
      # from `scripts/publish-crates-io.sh` only meant republishing an unchanged crate every cut.
      #
      # Ordering: host-kit's dependencies (`codewandler-flux-plugin-protocol` and the serde-only
      # leaves) are published by the FLUX closure, so a wire change must ship a flux release before
      # this step can resolve it. The preflight turns that into a named error instead of an opaque
      # `cargo publish` resolution failure.
      - name: Publish codewandler-flux-host-kit to crates.io
        if: ${{ inputs.publish }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -uo pipefail
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "::warning::CARGO_REGISTRY_TOKEN not set — skipping the host-kit publish"
            exit 0
          fi

          # Both crates carry an explicit `version = "…"` in their [package] section (they are on
          # the 1.x protocol line, not `version.workspace = true`), so read it directly rather than
          # paying a `cargo metadata` resolve.
          pkg_version() {
            awk '/^\[package\]/{p=1;next} /^\[/{p=0} p' "$1" \
              | sed -nE 's/^version *= *"([^"]+)".*/\1/p' | head -1
          }
          on_crates_io() {
            curl -sS --max-time 20 -H "User-Agent: flux-release (codewandler/flux)" \
              "https://crates.io/api/v1/crates/$1/$2" | grep -q "\"num\":\"$2\""
          }

          version="$(pkg_version plugins/host-kit/Cargo.toml)"
          if [ -z "$version" ]; then
            echo "::error::could not read the host-kit version from plugins/host-kit/Cargo.toml"
            exit 1
          fi

          if on_crates_io codewandler-flux-host-kit "$version"; then
            echo "codewandler-flux-host-kit@$version already on crates.io — nothing to publish"
            exit 0
          fi

          protocol="$(pkg_version crates/flux-plugin-protocol/Cargo.toml)"
          if ! on_crates_io codewandler-flux-plugin-protocol "$protocol"; then
            echo "::error::codewandler-flux-plugin-protocol@$protocol is not on crates.io yet — cut and publish a flux release first, then re-run this workflow"
            exit 1
          fi

          if ! cargo publish --manifest-path plugins/host-kit/Cargo.toml; then
            echo "::error::host-kit publish failed"
            exit 1
          fi
