# Deterministic Flux release cut (C-251).
#
# A push to the dedicated `release` branch is the deliberate release action. The cut job derives
# the version from fully framed git history plus the checked customer migration notice, validates
# the independently versioned wire crates, and runs the transactional cut. Release notes are
# ordinary reviewed source under `[Unreleased]`; this workflow never calls a model or accepts a
# provider credential.
#
# AUTHORITY SPLIT (C-354/C-559):
#
#   * `cut` has repository contents read-only and no long-lived secret. It builds Flux only to run
#     the narrow host-only `examples/release-cut.flux`, which has no `task`, network, general process,
#     or general write operation. Its product is a git bundle containing exactly one cut commit and
#     its annotated tag, with the release-branch trigger SHA as prerequisite.
#   * `release-control` alone receives the existing step-scoped `RELEASE_TOKEN`. The host helper
#     imports and verifies that bundle, opens the normal cut PR to `main`, waits for exact-head CI,
#     merges, stages the merged SHA as a candidate, verifies its immutable receipt, pushes the
#     annotated tag, watches publication, verifies the public release, and cleans up last.
#
# Manual dispatch remains non-publishing. `apply: false` previews the mechanically derived plan;
# `apply: true` rehearses the full transaction and local gate in the ephemeral runner. Neither mode
# uploads a cut bundle or reaches the controller.

name: release-flow

on:
  push:
    branches:
      - release
  workflow_dispatch:
    inputs:
      apply:
        description: "Cut in this runner as a rehearsal. false = deterministic preview; manual runs never promote."
        required: true
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TARGET_DIR: target
  RELEASE_APPLY: ${{ github.event_name == 'push' && 'true' || (inputs.apply && 'true' || 'false') }}
  # Host-owned signal consumed by release_cut. `cut-release.sh` independently verifies the Actions
  # event and ref, so a manual rehearsal cannot use it to bypass the full local gate.
  FLUX_RELEASE_CANDIDATE_OWNS_GATE: ${{ github.event_name == 'push' && 'true' || 'false' }}

concurrency:
  group: release-flow
  cancel-in-progress: false

jobs:
  cut:
    name: "plan · ${{ github.event_name == 'push' && 'cut' || (inputs.apply && 'cut (rehearsal)' || 'preview') }}"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      promote: ${{ steps.bundle.outputs.promote }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # The plan reads the last reachable version tag and every complete commit message since it.
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: "1.97.0"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      # `cut-release.sh` regenerates the embedded documentation snapshot. Hosted runners have Node
      # but not the lockfile's local Docusaurus binary, so install the same pinned toolchain as the
      # website gate before entering the transaction.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - run: npm ci
        working-directory: website

      - run: cargo fetch --locked

      # The host-only Flux program still crosses the guarded System process boundary for git and
      # the two fixed release scripts. Prove the unattended sandbox rather than weakening it.
      - name: Install and prove the sandbox backend
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --ro-bind / / --dev /dev --proc /proc --chdir "$GITHUB_WORKSPACE" true

      - name: Build the deterministic release host
        run: scripts/owned-cargo build --release --bin flux

      - name: Run the credential-free release flow
        id: flow
        run: |
          set -o pipefail
          git config user.name "flux release flow"
          git config user.email "release@codewandler.invalid"
          ./target/release/flux flow run examples/release-cut.flux \
            --arg apply="$RELEASE_APPLY" \
            --yes 2>&1 | tee "$RUNNER_TEMP/release-flow.out"

      - name: Post the deterministic release plan to the run summary
        if: always()
        run: |
          {
            echo "## Release flow — ${{ github.event_name == 'push' && 'automatic cut' || (inputs.apply && 'cut (rehearsal)' || 'preview') }}"
            echo
            echo '```'
            cat "$RUNNER_TEMP/release-flow.out" 2>/dev/null || echo "(no output captured)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: What happened in this manual run
        if: success() && github.event_name == 'workflow_dispatch'
        run: |
          if [ "$RELEASE_APPLY" = "true" ]; then
            echo "::notice::Rehearsal only. A commit and annotated tag existed only in this runner; no bundle was uploaded and nothing was promoted."
          else
            echo "::notice::Deterministic preview only. Nothing was written, committed, tagged, or published."
          fi

      # The handoff crosses the authority boundary as immutable bytes. The controller re-derives all
      # identities from the bundle; no version, SHA, or tag supplied by this job is trusted.
      - name: Bundle the cut for the promotion job
        id: bundle
        if: success() && github.event_name == 'push'
        run: scripts/bundle-release-cut.sh "$RUNNER_TEMP/release-cut.bundle"

      - name: Upload the cut bundle
        if: success() && github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-cut-bundle
          path: ${{ runner.temp }}/release-cut.bundle
          if-no-files-found: error
          retention-days: 5

  # The irreversible half, and the only core-release job that receives the repository PAT.
  # It runs no model, builds nothing, signs nothing and publishes nothing itself.
  release-control:
    name: "release-control · merge the cut and promote"
    needs: cut
    if: ${{ github.event_name == 'push' && needs.cut.outputs.promote == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Collect the cut bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-cut-bundle
          path: ${{ runner.temp }}/cut

      - name: Promote the merged cut to a public release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          RELEASE_CUT_BUNDLE: ${{ runner.temp }}/cut/release-cut.bundle
        run: scripts/promote-release-flow.sh
