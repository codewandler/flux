name: docs external links

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: public docs · external links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Check external links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --verbose --no-progress
            --exclude 'localhost|127\.0\.0\.1|agent\.example\.com|gitlab\.example\.com|prometheus\.local'
            README.md website/docs/**/*.md
          fail: true
