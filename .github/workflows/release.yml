#
# CI that:
#
# * prepares artifacts for an exact release commit when manually dispatched
# * promotes those immutable artifacts when the matching Git tag arrives
# * falls back to building on the tag when no prepared candidate exists
# * uploads the artifacts to a GitHub Release and verifies its public asset shape
#
# Note that the GitHub Release will be created with a generated
# title/body based on your changelogs.

name: Release
permissions:
  contents: write
  actions: read

# This task will run whenever you push a git tag that looks like a version
# like "1.0.0", "v0.1.0-prerelease.1", "my-app/0.1.0", "releases/v1.0.0", etc.
# Various formats will be parsed into a VERSION and an optional PACKAGE_NAME, where
# PACKAGE_NAME must be the name of a Cargo package in your workspace, and VERSION
# must be a Cargo-style SemVer Version (must have at least major.minor.patch).
#
# If PACKAGE_NAME is specified, then the announcement will be for that
# package (erroring out if it doesn't have the given version or isn't dist-able).
#
# If PACKAGE_NAME isn't specified, then the announcement will be for all
# (dist-able) packages in the workspace with that version (this mode is
# intended for workspaces with only one dist-able package, or with all dist-able
# packages versioned/released in lockstep).
#
# If you push multiple tags at once, separate instances of this workflow will
# spin up, creating an independent announcement for each one. However, GitHub
# will hard limit this to 3 tags per commit, as it will assume more tags is a
# mistake.
#
# If there's a prerelease-style suffix to the version, then the release(s)
# will be marked as a prerelease.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Plain X.Y.Z workspace version to prepare at this exact main commit"
        required: true
        type: string
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'

# A tag pushed while its exact candidate is still building waits for that build, then promotes it.
# Different release commits remain independent.
concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  # Run 'dist plan' (or host) to determine what tasks we need to do
  plan:
    runs-on: "ubuntu-22.04"
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
      tag: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || (startsWith(github.ref, 'refs/tags/') && github.ref_name || '') }}
      tag-flag: ${{ github.event_name == 'workflow_dispatch' && format('--tag=v{0}', inputs.version) || (startsWith(github.ref, 'refs/tags/') && format('--tag={0}', github.ref_name) || '') }}
      publishing: ${{ startsWith(github.ref, 'refs/tags/') }}
      preparing: ${{ github.event_name == 'workflow_dispatch' }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          submodules: recursive
      - name: Validate release-candidate request
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          CANDIDATE_VERSION: ${{ inputs.version }}
          DISPATCH_REF: ${{ github.ref }}
        run: |
          if [ "$DISPATCH_REF" != "refs/heads/main" ]; then
            echo "::error::release candidates must be prepared from main, got $DISPATCH_REF"
            exit 1
          fi
          workspace_version=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "$CANDIDATE_VERSION" != "$workspace_version" ]; then
            echo "::error::candidate version $CANDIDATE_VERSION does not match workspace version $workspace_version"
            exit 1
          fi
          scripts/release-candidate.sh write "$RUNNER_TEMP/request-receipt" \
            "$CANDIDATE_VERSION" "$GITHUB_SHA" "$GITHUB_RUN_ID"
      - name: Check release token is configured
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        env:
          RELEASE_TOKEN_CONFIGURED: ${{ secrets.RELEASE_TOKEN != '' }}
        run: |
          if [ "$RELEASE_TOKEN_CONFIGURED" != "true" ]; then
            echo "::error::RELEASE_TOKEN is required for tag publishes. Configure a fine-grained PAT for this repo with Contents: write; GITHUB_TOKEN has produced HTTP 403 on release creation."
            exit 1
          fi
      - name: Install dist
        # we specify bash to get pipefail; it guards against the `curl` command
        # failing. otherwise `sh` won't catch that `curl` returned non-0
        shell: bash
        run: "curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh | sh"
      - name: Cache dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/dist
      # sure would be cool if github gave us proper conditionals...
      # so here's a doubly-nested ternary-via-truthiness to try to provide the best possible
      # functionality based on whether this is a pull_request, and whether it's from a fork.
      # (PRs run on the *source* but secrets are usually on the *target* -- that's *good*
      # but also really annoying to build CI around when it needs secrets to work right.)
      - id: plan
        env:
          CANDIDATE_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            dist host --steps=create --tag="v$CANDIDATE_VERSION" --allow-dirty --output-format=json > plan-dist-manifest.json
          elif [[ "$GITHUB_REF" = refs/tags/* ]]; then
            dist host --steps=create --tag="$GITHUB_REF_NAME" --allow-dirty --output-format=json > plan-dist-manifest.json
          else
            dist plan --allow-dirty --output-format=json > plan-dist-manifest.json
          fi
          echo "dist ran successfully"
          cat plan-dist-manifest.json
          echo "manifest=$(jq -c "." plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts-plan-dist-manifest
          path: plan-dist-manifest.json
          retention-days: 14

  # A tag may reuse only a successful manual run of this workflow at the tag's exact commit. The
  # receipt repeats the version, SHA, and immutable run ID so lookup cannot degrade to version-only.
  resolve-release-candidate:
    needs: plan
    runs-on: ubuntu-22.04
    outputs:
      run-id: ${{ steps.select.outputs.run-id }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - id: lookup
        name: Find successful exact-SHA candidate
        if: ${{ needs.plan.outputs.publishing == 'true' }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::warning::$GITHUB_REF_NAME is not a plain vX.Y.Z tag; using the compatibility build path"
            exit 0
          fi
          run_id=$(scripts/find-release-candidate.sh "$GITHUB_REPOSITORY" "$GITHUB_SHA")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"
      - name: Download candidate receipt
        if: ${{ steps.lookup.outputs.run-id != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-receipt
          path: candidate
          run-id: ${{ steps.lookup.outputs.run-id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
      - id: select
        name: Verify candidate provenance or select fallback
        env:
          CANDIDATE_RUN_ID: ${{ steps.lookup.outputs.run-id }}
          VERSION: ${{ steps.lookup.outputs.version }}
        run: |
          if [ -z "$CANDIDATE_RUN_ID" ]; then
            if [ "${{ needs.plan.outputs.publishing }}" = "true" ]; then
              echo "::warning::no prepared candidate exists for $GITHUB_SHA; rebuilding all release targets"
              echo "### Release candidate: compatibility rebuild" >> "$GITHUB_STEP_SUMMARY"
              echo "No successful prepared candidate was found at \`$GITHUB_SHA\`." >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 0
          fi
          scripts/release-candidate.sh verify candidate/release-candidate.txt \
            "$VERSION" "$GITHUB_SHA" "$CANDIDATE_RUN_ID"
          echo "run-id=$CANDIDATE_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "### Release candidate: promoted without rebuilding" >> "$GITHUB_STEP_SUMMARY"
          echo "Candidate run: [$CANDIDATE_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID)" >> "$GITHUB_STEP_SUMMARY"

  # Build and packages all the platform-specific things
  build-local-artifacts:
    name: build-local-artifacts (${{ join(matrix.targets, ', ') }})
    # Let the initial task tell us to not run (currently very blunt)
    needs:
      - plan
      - resolve-release-candidate
    if: ${{ always() && needs.plan.result == 'success' && needs.resolve-release-candidate.result == 'success' && fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix.include != null && (needs.plan.outputs.preparing == 'true' || (needs.plan.outputs.publishing == 'true' && needs.resolve-release-candidate.outputs.run-id == '') || fromJson(needs.plan.outputs.val).ci.github.pr_run_mode == 'upload') }}
    strategy:
      fail-fast: false
      # Target platforms/runners are computed by dist in create-release.
      # Each member of the matrix has the following arguments:
      #
      # - runner: the github runner
      # - dist-args: cli flags to pass to dist
      # - install-dist: expression to run to install dist on the runner
      #
      # Typically there will be:
      # - 1 "global" task that builds universal installers
      # - N "local" tasks that build each platform's binaries and platform-specific installers
      matrix: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container && matrix.container.image || null }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/${{ join(matrix.targets, '-') }}-dist-manifest.json
    steps:
      - name: enable windows longpaths
        run: |
          git config --global core.longpaths true
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install Rust non-interactively if not already installed
        if: ${{ matrix.container }}
        run: |
          if ! command -v cargo > /dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          fi
      - name: Install dist
        run: ${{ matrix.install_dist.run }}
      # Get the dist-manifest
      - name: Fetch local artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - name: Install dependencies
        run: |
          ${{ matrix.packages_install }}
      - name: Build artifacts
        run: |
          # Actually do builds and make zips and whatnot
          dist build ${{ needs.plan.outputs.tag-flag }} --allow-dirty --print=linkage --output-format=json ${{ matrix.dist_args }} > dist-manifest.json
          echo "dist ran successfully"
      - id: cargo-dist
        name: Post-build
        # We force bash here just because github makes it really hard to get values up
        # to "real" actions without writing to env-vars, and writing to env-vars has
        # inconsistent syntax between shell and powershell.
        shell: bash
        run: |
          # Parse out what we just built and upload it to scratch storage
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          dist print-upload-files-from-manifest --manifest dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts-build-local-${{ join(matrix.targets, '_') }}
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}
          retention-days: 14

  # Build and package all the platform-agnostic(ish) things
  build-global-artifacts:
    needs:
      - plan
      - build-local-artifacts
    runs-on: "ubuntu-22.04"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/global-dist-manifest.json
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install cached dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      # Get all the local artifacts for the global tasks to use (for e.g. checksums)
      - name: Fetch local artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: cargo-dist
        shell: bash
        run: |
          dist build ${{ needs.plan.outputs.tag-flag }} --allow-dirty --output-format=json "--artifacts=global" > dist-manifest.json
          echo "dist ran successfully"

          # Parse out what we just built and upload it to scratch storage
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          jq --raw-output ".upload_files[]" dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts-build-global
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}
          retention-days: 14

  # A preparation run becomes eligible for promotion only after every cargo-dist build succeeds.
  # Its receipt is deliberately separate from `artifacts-*`, so it can never become a release asset.
  record-release-candidate:
    needs:
      - plan
      - build-local-artifacts
      - build-global-artifacts
    if: ${{ always() && needs.plan.outputs.preparing == 'true' && needs.plan.result == 'success' && needs.build-local-artifacts.result == 'success' && needs.build-global-artifacts.result == 'success' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Write exact-SHA candidate receipt
        env:
          VERSION: ${{ inputs.version }}
        run: |
          scripts/release-candidate.sh write release-candidate.txt \
            "$VERSION" "$GITHUB_SHA" "$GITHUB_RUN_ID"
      - name: Upload candidate receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-receipt
          path: release-candidate.txt
          if-no-files-found: error
          retention-days: 14
      - name: Summarize prepared candidate
        env:
          VERSION: ${{ inputs.version }}
        run: |
          echo "### Release candidate prepared" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: \`$VERSION\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Candidate run: \`$GITHUB_RUN_ID\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Retention: 14 days; after expiry the tag workflow rebuilds explicitly" >> "$GITHUB_STEP_SUMMARY"

  # Determines if we should publish/announce
  host:
    needs:
      - plan
      - resolve-release-candidate
      - build-local-artifacts
      - build-global-artifacts
    # Only run if we're "publishing", and only if plan, local and global didn't fail (skipped is fine)
    if: ${{ always() && needs.plan.result == 'success' && needs.resolve-release-candidate.result == 'success' && needs.plan.outputs.publishing == 'true' && (needs.build-global-artifacts.result == 'skipped' || needs.build-global-artifacts.result == 'success') && (needs.build-local-artifacts.result == 'skipped' || needs.build-local-artifacts.result == 'success') }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    runs-on: "ubuntu-22.04"
    outputs:
      val: ${{ steps.host.outputs.manifest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install cached dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      # A prepared candidate is downloaded by immutable run ID. Without one, these artifacts come
      # from the current tag run's compatibility builds.
      - name: Fetch prepared candidate artifacts
        if: ${{ needs.resolve-release-candidate.outputs.run-id != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
          run-id: ${{ needs.resolve-release-candidate.outputs.run-id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
      - name: Fetch compatibility-build artifacts
        if: ${{ needs.resolve-release-candidate.outputs.run-id == '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: host
        shell: bash
        run: |
          dist host ${{ needs.plan.outputs.tag-flag }} --allow-dirty --steps=upload --steps=release --output-format=json > dist-manifest.json
          echo "artifacts uploaded and released successfully"
          cat dist-manifest.json
          echo "manifest=$(jq -c "." dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Overwrite the previous copy
          name: artifacts-dist-manifest
          path: dist-manifest.json
          retention-days: 14
      # Create a GitHub Release while uploading all files to it
      - name: "Download prepared GitHub artifacts"
        if: ${{ needs.resolve-release-candidate.outputs.run-id != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true
          run-id: ${{ needs.resolve-release-candidate.outputs.run-id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
      - name: "Download compatibility-build GitHub artifacts"
        if: ${{ needs.resolve-release-candidate.outputs.run-id == '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true
      - name: Record promoted candidate
        if: ${{ needs.resolve-release-candidate.outputs.run-id != '' }}
        env:
          CANDIDATE_RUN_ID: ${{ needs.resolve-release-candidate.outputs.run-id }}
        run: |
          echo "Promoting immutable artifacts from candidate run $CANDIDATE_RUN_ID"
          echo "Source: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
      - name: Cleanup
        run: |
          # Remove the granular manifests. NOTE: this glob also matches the plan job's
          # `plan-dist-manifest.json`, which the candidate-promotion path downloads — so the
          # top-level manifest has to be re-placed below or the release ships without it (C-47:
          # v0.27.0 was created with 27 assets but no dist-manifest.json and failed verification).
          rm -f artifacts/*-dist-manifest.json
          # The `dist host` step above wrote the release's own manifest to the workspace root; it
          # is a required release asset, so put it where `gh release create artifacts/*` sees it.
          cp dist-manifest.json artifacts/dist-manifest.json
      - name: Create GitHub Release
        env:
          # Scoped release token: a fine-grained PAT (this repo only, Contents: write) stored as the
          # `RELEASE_TOKEN` secret, so the release object is created even when the org restricts the
          # default GITHUB_TOKEN or GitHub App integration from creating releases.
          # NOTE: release.yml is cargo-dist-generated — re-apply this override after `dist generate`.
          GH_TOKEN: "${{ secrets.RELEASE_TOKEN }}"
          PRERELEASE_FLAG: "${{ fromJson(steps.host.outputs.manifest).announcement_is_prerelease && '--prerelease' || '' }}"
          ANNOUNCEMENT_TITLE: "${{ fromJson(steps.host.outputs.manifest).announcement_title }}"
          ANNOUNCEMENT_BODY: "${{ fromJson(steps.host.outputs.manifest).announcement_github_body }}"
          RELEASE_COMMIT: "${{ github.sha }}"
        run: |
          # Write and read notes from a file to avoid quoting breaking things
          echo "$ANNOUNCEMENT_BODY" > $RUNNER_TEMP/notes.txt

          tag="${{ needs.plan.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; refreshing assets with --clobber"
            gh release upload "$tag" artifacts/* --clobber
          else
            for attempt in 1 2 3; do
              if gh release create "$tag" --target "$RELEASE_COMMIT" $PRERELEASE_FLAG --title "$ANNOUNCEMENT_TITLE" --notes-file "$RUNNER_TEMP/notes.txt" artifacts/*; then
                break
              fi
              if gh release view "$tag" >/dev/null 2>&1; then
                echo "Release $tag exists after create failure; refreshing assets with --clobber"
                gh release upload "$tag" artifacts/* --clobber
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "::error::failed to create GitHub Release $tag after $attempt attempts"
                exit 1
              fi
              sleep $((attempt * 15))
            done
          fi
      - name: Verify GitHub Release
        env:
          GH_TOKEN: "${{ secrets.RELEASE_TOKEN }}"
        run: scripts/verify-github-release.sh "${{ needs.plan.outputs.tag }}"

  announce:
    needs:
      - plan
      - host
    # use "always() && ..." to allow us to wait for all publish jobs while
    # still allowing individual publish jobs to skip themselves (for prereleases).
    # "host" however must run to completion, no skipping allowed!
    if: ${{ always() && needs.host.result == 'success' }}
    runs-on: "ubuntu-22.04"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          submodules: recursive
