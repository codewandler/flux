name: tree-sitter-corpus

# C-334: the grammar revision `.helix/languages.toml` PINS must parse every canonical `examples/*.flux`
# with no ERROR and no MISSING node. `AGENTS.md` concedes that editor-tooling mirrors are manual and
# that only ONE of the four is guarded — and the guarded one (the website's Prism grammar) is the only
# one that CANNOT break parsing. This is the first check on any of the three that can.
#
# WHY ITS OWN WORKFLOW RATHER THAN A JOB IN `ci.yml`. The check fetches the grammar from GitHub and
# downloads the tree-sitter CLI from a release asset, so it cannot be a PR gate: a network hiccup
# would block unrelated work. `ci.yml` triggers on `push`+`pull_request` and nothing else, so making
# this nightly from inside it would mean adding `schedule:` to `ci.yml`'s own `on:` block — which
# re-triggers all NINE of its jobs every night. A job-level `if:` can stop this job running on a PR;
# it cannot un-trigger the other eight at 03:17. Declaring the trigger here says "not a PR gate" in
# the one place a reader looks for it, and matches what `adversarial-assurance.yml` already does for
# its weekly lane.
#
# Deliberately NOT triggered on version tags either. A grammar defect lives in a DIFFERENT
# repository, so a red here is never something a cut can fix — failing a release on it would block
# shipping flux over a bug flux cannot land the fix for.
#
# ⚠ THE CONTRACT THIS LANE ENFORCES, and what a red means when you see one (L-118). Green is the
# normal state at the current `7a90ffa` pin: every canonical `examples/*.flux` parses with zero ERROR
# and zero MISSING nodes, and the grammar additionally covers C-320's JSON-quoted bracket keys such
# as `headers[ "content-type" ]`, including Flux's accepted internal whitespace. There is no
# allowlist, no expected-failure list, and no file exempted — the whole corpus, or red. Keep it that
# way; the two things that would quietly destroy this lane's value are an allowlist and a second
# corpus, and it has neither.
#
# So a red here means exactly one thing: **the revision `.helix/languages.toml` pins cannot parse
# Flux that flux itself ships as canonical**, and every construct the log names is a red squiggle in
# Helix, Neovim and Zed right now. The fix is upstream in `codewandler/flux-tree-sitter`, followed by
# MOVING THE PIN — landing the grammar fix without moving the pin reaches nobody, which is the
# C-334 failure mode and has now been observed twice.
#
# HOW IT GOT HERE, because the shape of the last red is the pattern to follow. C-334 built this
# check; its first run against the then-current pin (`9ea9890`) reported 166 defect nodes across 7 of
# the 15 examples then in the corpus, on six construct families the grammar had never supported —
# bare-identifier binds, typed binds, `ctx` blocks, `+=`, a column-0 `goal "..."` under a `flow`
# header, and optional field access. C-340 fixed them upstream, family by family, and moved the pin
# to `2dbec53`. Nobody had known, and the reason is the one C-334 forbids repeating: the grammar repo
# had its OWN 3-file `examples/` corpus and its CI parsed that one, which at the identical rev was
# 100% clean while flux's was 47% broken. A second corpus did not merely permit the drift — it
# certified it. C-340 demoted that corpus to a smoke set; the grammar repo's CI now parses THIS
# corpus, so both repositories are held to one contract.
#
# NIGHTLY-ONLY IS THE STANDING HAZARD, and it is why this preamble is guarded rather than trusted.
# A red here blocks no push, no PR and no cut, so nothing puts a reader in front of it and a stale
# claim in this header can outlive the state it describes by months — which is exactly what happened
# between C-340 and L-118, when this block went on announcing a red that had already been fixed.
# `crates/flux-lang/tests/tree_sitter_lane_contract.rs` now fails on any PR if this file stops naming
# the revision the pin actually carries, or points at a story that does not exist. Move the pin and
# you must move this preamble with it.
#
# `timeout-minutes` is set. No job in `ci.yml` sets one — the check clones a repo and runs `npm
# install`, both of which hang rather than fail when a network path goes bad, and an unbounded
# scheduled job burns a runner for six hours before anyone notices.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  corpus:
    name: the pinned tree-sitter rev parses every canonical example
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # `node`/`npm` ship with the runner image; the script exits 2 (skip) if they are missing, and a
      # skip in the ONE lane that runs this check would be a silent hole. Assert them here so their
      # absence is a loud failure in this workflow instead of a quiet pass.
      - name: The runner has the toolchain this check needs
        run: |
          node --version
          npm --version
          cc --version | head -1

      - name: The pinned grammar parses examples/*.flux with no ERROR or MISSING nodes
        run: |
          # Live GitHub + npm state, not this tree's — see the script header for why exit 2 (the
          # grammar or the CLI could not be obtained) is a logged skip rather than a failure.
          set +e
          ./scripts/check-tree-sitter-corpus.sh --self-test && ./scripts/check-tree-sitter-corpus.sh
          status=$?
          set -e
          if [ "$status" -eq 2 ]; then
            echo "::warning::tree-sitter corpus check skipped — the pinned grammar or the tree-sitter CLI was unobtainable"
            exit 0
          fi
          exit "$status"
