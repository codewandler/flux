name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Workflow consumers intentionally use checkout-relative target/... paths.
  CARGO_TARGET_DIR: target
  # Note: deliberately NOT setting `RUSTFLAGS: -D warnings` globally — that would also deny warnings
  # in third-party dependencies, breaking CI on any upstream warning or new rustc lint. Warning
  # enforcement for our own code lives in the clippy step below (`-- -D warnings`).

jobs:
  build-ownership:
    name: build ownership · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install the pinned Go toolchain for Task
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.25.10
          cache: false

      - name: Install the pinned Task runner
        shell: bash
        run: |
          go install github.com/go-task/task/v3/cmd/task@v3.52.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # This invokes unoverridden `task install` against a fake Cargo in a fresh HOME/CARGO_HOME.
      # The fake refuses unless the native Unix/Windows lease already exists before target creation.
      # Do not provision Python: each launcher must find the documented native prerequisite itself.
      - name: Native ownership and Task bootstrap (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: scripts/run-python3.sh scripts/test_build_ownership.py

      - name: Native ownership and Task bootstrap (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: scripts\run-python3.cmd scripts\test_build_ownership.py

  check:
    name: build · test · clippy · fmt · layering (no sandbox backend)
    runs-on: ubuntu-latest
    # C-266: this is the WITHOUT-a-backend side of C-262's fail-closed sandbox switch, and it is now
    # so by construction rather than by luck. Stock runners happen to have no `bubblewrap` today, so
    # every step below was already exercising the unconfined path — but nothing said so, nothing
    # asserted it, and a runner image that starts shipping bwrap would silently retire the coverage.
    # Forcing discovery at a nonexistent path is exactly the reproduction that found the three
    # regression sites during the 0.38.0 cut, applied to the whole job — the workspace tests AND the
    # smoke-live shape guard, whose step 5 (`app run --serve`) a `cargo test` run does not cover.
    # The with-a-backend side is the `sandbox-backend` job below; both sides must stay green.
    env:
      FLUX_BWRAP_BIN: /nonexistent/bwrap
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # The committed server archive mirrors the rendered public website. This stays in the
      # unfiltered PR workflow: generated website content can change from sources outside
      # website/**, so a path filter would admit a stale archive.
      - name: Install pinned website toolchain
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install pinned website dependencies
        run: npm ci
        working-directory: website

      - name: Embedded documentation matches the public website
        run: scripts/build-embedded-docs.sh --check

      - name: Publication workflow contracts
        run: |
          scripts/test-embedded-docs-gates.sh
          scripts/test-release-candidate.sh

      - name: Install Rust toolchain
        # Pinned, not `stable`: every Rust release ships new clippy lints that `-D warnings`
        # promotes to errors, so a floating CI toolchain breaks on code that is clean locally
        # (hit on the 1.96→1.97 bump, 2026-07-09). To bump: update the version here, run
        # both-workspace clippy/fmt locally on that same version, fix, commit.
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          # `master` above pins the action's *code* to a commit (C-187); the toolchain the tag used
          # to encode is now an explicit — and, at this SHA, required — input. To bump: change the
          # version here, run both-workspace clippy/fmt on it, fix, commit.
          toolchain: "1.97.0"
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      # The layering lint runs `cargo metadata --locked --offline`, which needs every lockfile
      # dep's manifest locally — including other-target deps (e.g. android_system_properties) that
      # `cargo build` never downloads on this runner. Fetch the full locked closure up front so a
      # fresh cache (any Cargo.lock change) can't fail the lint.
      - name: Fetch locked dependencies (all targets)
        run: cargo fetch --locked

      - name: Build ownership inventory and native compiler disappearance regression
        run: |
          python scripts/test_build_entrypoints.py
          scripts/test-build-ownership.sh --sqlite

      # C-450: Cargo.lock pins versions, while this review lock pins the direct edges that selected
      # them and calls out dependencies that execute build.rs during the build.
      - name: Direct dependencies are explicitly acknowledged
        run: ./scripts/check-crate-versions.sh --direct-dependencies root

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy (deny warnings)
        run: scripts/owned-cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: scripts/owned-cargo build --workspace

      - name: Test
        run: scripts/owned-cargo test --workspace

      # The architecture lint (fluxplane `codegate` analog): inner crates must not depend on outer
      # layers. Run explicitly too so a layering regression is an obvious, named failure. Since C-266
      # this crate also owns the sandbox-posture lint on test spawns — the named check that turns "a
      # new auto-approved spawn forgot to declare its posture" into a local failure with a file:line,
      # instead of a red CI run three pushes later. Since C-328 it also owns the **pin census**: a
      # wiring line on an SDK client-builder chain must name, in-source, the test that dies when it
      # is deleted. `cargo test --workspace` above cannot catch that class by construction — the
      # whole point is that the suite stays green when the line goes.
      - name: Architecture layering, test sandbox-posture, and pin-census lints
        run: scripts/owned-cargo test -p flux-codegate

      # C-308: `cargo test --workspace` above builds every member with its DEFAULT features, so a
      # target behind a non-default one is invisible to it — and a test no gate exercises is a test
      # that does not exist. `codewandler-flux-lang/cli`'s `fluxlang` tests were red on main for as
      # long as it took someone to run that crate's documented dev loop by hand, while this job
      # reported green. The script runs those legs AND fails when a newly-declared feature (in either
      # workspace) has no stated disposition, so the hole cannot silently reopen.
      - name: Feature-gated test targets the default workspace build never compiles
        run: ./scripts/check-feature-gated-tests.sh

      # Hermetic drift guard for the live smoke gate (C-39): re-runs steps 1-5's invocation *shapes*
      # from scripts/smoke-live.sh against the offline `mock` provider — no credentials, no live
      # spend — so a future CLI-surface change (renamed subcommand, dropped flag) fails here instead
      # of only being caught the next time someone remembers to run the real live gate by hand.
      - name: Live smoke gate — CLI shape guard (hermetic, no credentials)
        run: FLUX_BIN="$PWD/target/debug/flux" ./scripts/smoke-live.sh --shapes

  sandbox-backend:
    name: fail-closed sandbox switch · with a real backend
    runs-on: ubuntu-latest
    # C-266: the other side of the switch C-262 installed. `check` above proves flux still works when
    # NO sandbox backend exists; nothing proved it works when one DOES, because no runner had
    # bubblewrap and every developer machine has it — so the confined path was exercised on no CI
    # host at all, and the unconfined path was the only one anyone ever saw here.
    #
    # `FLUX_TEST_SANDBOX_BACKEND=1` is this lane's promise that a usable backend is installed.
    # `crates/flux-cli/tests/sandbox_backend.rs` treats it as a claim to verify, not a hint: its first
    # test FAILS the job when `doctor` reports no functional backend. That matters because installing
    # bubblewrap is not the same as having it work — a kernel that refuses unprivileged user
    # namespaces (Ubuntu 23.10+'s AppArmor restriction, default-seccomp Docker) resolves
    # `Unsupported`, which would quietly turn this lane into a second copy of `check`: green, and
    # proving nothing.
    #
    # C-280: that is not hypothetical, and it did not take long. This lane's FIRST real run
    # (30564156249, 2026-07-30) failed exactly that way — `ubuntu-latest` is now Ubuntu 24.04, which
    # ships `kernel.apparmor_restrict_unprivileged_userns=1`. `bubblewrap` installed, `bwrap
    # --version` succeeded, and the kernel still refused the namespace, so `doctor` reported the
    # backend `WARN` and both assertions failed. The guard did its job; the runner needed work to
    # host this lane at all. That is what the "permit unprivileged user namespaces" step below is
    # for, and why it exists at all is worth knowing before anyone deletes it.
    #
    # Note what is NOT duplicated from `check`: clippy and fmt are posture-independent, so this lane
    # runs only the parts whose behavior a backend can change.
    env:
      FLUX_TEST_SANDBOX_BACKEND: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Rust toolchain
        # Pinned for the same reason as the `check` job — see its comment.
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: "1.97.0"

      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      # `cargo test --workspace` includes flux-codegate's layering lint, which resolves
      # `cargo metadata --locked --offline` over the FULL lockfile closure — see the same step in the
      # `check` job for why a fresh cache fails the lint without this.
      - name: Fetch locked dependencies (all targets)
        run: cargo fetch --locked

      - name: Install bubblewrap (the Linux sandbox backend)
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          bwrap --version

      # C-280. Three fixes were on the table and they are not equivalent:
      #
      #   * pin the job to `ubuntu-22.04` — no such restriction, but an announced retirement, so it
      #     buys time rather than fixing anything. Worse, it would make this the one lane running on
      #     an older image than every other job, so "flux confines correctly" would stop being a
      #     statement about the platform CI actually tests on.
      #   * run the lane in a container that provides the namespace itself — the heaviest option, and
      #     the one with a vacuity hazard: GitHub container jobs run as root, and root can create a
      #     user namespace even under this AppArmor restriction. The lane would go green for a reason
      #     that has nothing to do with the posture flux runs in, which is precisely the failure mode
      #     C-266 built this lane to prevent.
      #   * clear the sysctl on the job's own throwaway VM — chosen. It is one line, it keeps the lane
      #     on the same image as every other job, and it is honest about what it does.
      #
      # What it costs: the lane proves flux confines on a host *reconfigured to permit* unprivileged
      # userns, not on a stock ubuntu-latest. That is the right subject — the code under test is
      # flux's confinement path, not Ubuntu's kernel policy — and the other posture is not lost: a
      # host that refuses userns resolves to no backend, which the `check` job above asserts
      # hermetically. Between them both real postures still have a lane.
      #
      # Deliberately best-effort, and deliberately NOT the gate. If the knob ever disappears (a future
      # image drops AppArmor, or Ubuntu retires the restriction) `sysctl -w` fails on a host that
      # confines perfectly well, and failing here would red `main` for no defect. Whether confinement
      # is REAL stays where C-266 put it: `a_promised_backend_is_real_and_functional` fails the job on
      # a `WARN` backend. This step only clears a known obstacle in front of that assertion — it must
      # never become the thing that decides the lane passed.
      - name: Permit unprivileged user namespaces (Ubuntu 24.04's AppArmor restriction)
        run: |
          echo "before: $(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>&1 || true)"
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 \
            || echo "::notice::could not clear the AppArmor userns restriction; if this runner can still confine the lane passes anyway, and if it cannot the sandbox-backend assertion below says so"
          echo "after:  $(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>&1 || true)"

      # Fail fast and attributably. This is a strict SUBSET of the flag set flux's own preflight probe
      # uses (`--unshare-pid`/`--unshare-ipc`/`--unshare-uts`/… — see `bwrap_probe_argv` in
      # `crates/flux-system/src/sandbox.rs`), so it cannot fail where flux would have succeeded. If it
      # fails, the runner genuinely cannot confine and the next ten minutes of building would only
      # arrive at the same conclusion with the blame pointed at the diff under test instead of at the
      # image. It does not replace the assertion below — a subset probe passing proves less than
      # `doctor` does.
      - name: The runner can actually create a user namespace
        run: bwrap --unshare-user --unshare-pid --ro-bind / / /bin/true

      - name: Build
        run: scripts/owned-cargo build --workspace

      # The whole suite, with a live backend. `sandbox_posture.rs` stays green here because it forces
      # backend discovery at nonexistent paths itself — it asserts the no-backend postures hermetically
      # rather than by inferring them from the host, which is what makes a two-sided gate possible at
      # all without weakening a single one of its assertions.
      - name: Test (workspace, sandbox backend available)
        run: scripts/owned-cargo test --workspace

      # Step 5 of the shape guard (`app run --serve`) is a serving surface, and serving surfaces
      # inherit `require`. With a real backend it must start CONFINED — the posture the guard could
      # never check before, and the site the 0.38.0 cut found last.
      - name: Live smoke gate — CLI shape guard, confined (hermetic, no credentials)
        run: FLUX_SANDBOX=require FLUX_BIN="$PWD/target/debug/flux" ./scripts/smoke-live.sh --shapes

  portable-wasm:
    name: the portable core still compiles to wasm32 and matches the native engine
    runs-on: ubuntu-latest
    # C-279. C-271 landed a real proof — the portable core built for `wasm32-unknown-unknown`, run
    # inside a Wasm engine, asserted byte-identical to the native engine on the same `.flux` source —
    # and then nothing ran it. `crates/flux-lang/tests/wasm_parity.rs` skips (loudly to stdout, but it
    # PASSES) when the module is absent, and the module is absent on every machine without the wasm32
    # target installed, which is every runner. So `cargo test --workspace` was green and the proof was
    # decorative. Measured, at 80bb31fa: with a deliberate off-by-one in `flux_eval`'s packed return,
    # `cargo test --workspace` exited 0 while this lane's command failed 2 of 4 parity tests.
    #
    # `FLUX_PORTABLE_WASM_REQUIRED=1` is what makes the lane incapable of passing vacuously: it turns
    # "the module is not built" from a skip into a failure. `scripts/build-portable-wasm.sh` already
    # sets it on the `cargo test` it runs; declaring it here as well states the requirement in the
    # workflow itself, so it survives someone simplifying the script and cannot be lost silently.
    #
    # WHERE THIS RUNS: every push and every pull request, with NO `paths:` filter. That is deliberate
    # and it is the expensive-looking half of this story, so the reasoning is written down:
    #
    #   * The regression class is feature unification, not file locality. C-271's actual blocker was
    #     tokio's `net` feature pulling `mio`, which refuses to compile on wasm32. Cargo unifies
    #     features across the workspace, so ANY crate adding a feature to a shared dependency can
    #     break the wasm build. A filter on `crates/flux-lang/**` would skip precisely the PR that
    #     did it.
    #   * A correct filter would have to enumerate flux-lang's transitive closure plus the root
    #     manifest and the lockfile — a second, hand-maintained copy of the dependency graph with
    #     nothing checking it. It rots silently, and its failure mode is "the lane did not run on the
    #     PR that broke the thing" — the exact defect class this story exists to close, and the
    #     fourth instance of it this cycle after C-248, C-259 and C-264.
    #   * The cost does not buy enough to justify that risk. This job is parallel and is nowhere near
    #     the critical path: `check` builds, tests, clippies and smoke-tests the whole workspace,
    #     while this builds one crate's dependency closure twice (wasm32 release + host debug test)
    #     and runs four tests. Its marginal effect on CI wall-clock is ~0; it costs runner-minutes on
    #     a job far smaller than `check`. Locally the wasm half is ~15s wall / ~71s CPU from a clean
    #     wasm target dir with a warm registry.
    #   * The repo has already made this trade once and written it down: `website.yml` refuses a
    #     `paths:` filter on main because "a stale public page that contradicts the tree costs more"
    #     than the couple of minutes it saves. Same trade, same answer.
    env:
      FLUX_PORTABLE_WASM_REQUIRED: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Rust toolchain (with the wasm32 target)
        # Pinned for the same reason as the `check` job — see its comment. `targets:` is what retires
        # `rustup target add wasm32-unknown-unknown` as a manual prerequisite: the build script
        # refuses to run (exit 2) rather than falling back to a host build, so a target this action
        # failed to install fails the lane instead of quietly proving nothing.
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: "1.97.0"
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      # No `cargo fetch --locked` step here, unlike `check` and `sandbox-backend`: theirs exists for
      # flux-codegate's layering lint, which resolves `cargo metadata --locked --offline` over the
      # full lockfile closure. This lane never runs that lint, so the fetch would be cost with no
      # corresponding failure to prevent.

      # Builds the `wasm32-unknown-unknown` cdylib and then runs the parity assertion against the
      # artifact it just produced. The script is the single recorded command (C-271 acceptance), so
      # the lane deliberately calls it rather than re-spelling its steps — a lane that drifted from
      # the command developers run by hand would be gating something nobody else executes.
      - name: Build the portable core for wasm32 and assert parity with the native engine
        run: ./scripts/build-portable-wasm.sh

  plugins:
    name: plugins workspace · build · test · clippy · fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Rust toolchain
        # Pinned, not `stable`: every Rust release ships new clippy lints that `-D warnings`
        # promotes to errors, so a floating CI toolchain breaks on code that is clean locally
        # (hit on the 1.96→1.97 bump, 2026-07-09). To bump: update the version here, run
        # both-workspace clippy/fmt locally on that same version, fix, commit.
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          # `master` above pins the action's *code* to a commit (C-187); the toolchain the tag used
          # to encode is now an explicit — and, at this SHA, required — input. To bump: change the
          # version here, run both-workspace clippy/fmt on it, fix, commit.
          toolchain: "1.97.0"
          components: rustfmt, clippy

      # The integration plugin pack (D-08) is a nested cargo workspace, EXCLUDED from the root workspace
      # (heavy vendor deps), so the `check` job above never builds it — gate it here in its own job.
      - name: Cache cargo (plugins)
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: plugins

      - name: Format
        working-directory: plugins
        run: cargo fmt --all --check

      - name: Clippy (deny warnings)
        working-directory: plugins
        run: ../scripts/run-python3.sh ../scripts/build_ownership.py shared --workspace-root "$PWD" -- cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        working-directory: plugins
        run: ../scripts/run-python3.sh ../scripts/build_ownership.py shared --workspace-root "$PWD" -- cargo build --workspace

      - name: Test
        working-directory: plugins
        run: ../scripts/run-python3.sh ../scripts/build_ownership.py shared --workspace-root "$PWD" -- cargo test --workspace

      - name: Direct dependencies are explicitly acknowledged
        run: ./scripts/check-crate-versions.sh --direct-dependencies plugins

  crate-versions:
    name: independently-versioned crates moved their version
    runs-on: ubuntu-latest
    # The other half of dropping the lockstep (C-146). Crates on the 1.x protocol line are NOT swept
    # by `scripts/cut-release.sh`, so nothing else stops an edit shipping under a version already on
    # crates.io — where `cargo publish` would skip it and every consumer would keep the old code.
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0 # the check diffs against the previous v* tag

      - name: A changed crate on an independent version line changed its version
        run: |
          ./scripts/check-crate-versions.sh --self-test
          ./scripts/check-crate-versions.sh

  action-pins:
    name: third-party actions are pinned to a commit SHA
    runs-on: ubuntu-latest
    # C-187: a `uses:` on a movable tag hands whoever controls that upstream tag the code running in
    # our workflows — including release.yml (crates.io publish) and release-plugins.yml (the Minisign
    # signing key). Fail CI the moment an unpinned action reappears. Runs on the checkout only, so no
    # Rust build is needed.
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Every third-party action names a full commit SHA
        run: |
          ./scripts/check-action-pins.sh --self-test
          ./scripts/check-action-pins.sh

      - name: Release bootstrap and provenance policy
        run: |
          ./scripts/check-release-integrity.sh --self-test
          ./scripts/check-release-integrity.sh

  no-direct-io:
    name: model-facing tool crates do not reach IO behind flux-system
    runs-on: ubuntu-latest
    # C-263: one syn-based codegate resolves aliases/imports across every classified production
    # operation pack. The wrapper has no second crate list or weaker text-pattern fallback.
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Structural no-direct-IO gate and adversarial fixtures
        run: |
          ./scripts/check-no-direct-io.sh --self-test
          ./scripts/check-no-direct-io.sh

  host-kit-protocol-drift:
    name: published host-kit is not behind the live protocol version
    runs-on: ubuntu-latest
    # C-167: the ordering preflight in release-plugins.yml and the crate-versions job above both
    # watch for COMMISSIONS (a wrong publish order; a changed-but-unbumped crate). Neither catches
    # an OMISSION — a flux release publishing a newer `codewandler-flux-plugin-protocol` while
    # nobody runs the pack workflow to publish a `codewandler-flux-host-kit` that depends on it.
    # This runs on every push to main (i.e. every flux release commit), not only inside the pack
    # workflow that may never be dispatched — so a flux cut tells you a pack release is now owed.
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Published host-kit's protocol requirement is not behind the live protocol version
        run: |
          # Live crates.io state, not this tree's — see the script header for why exit 2 (data
          # unobtainable, e.g. a crates.io outage) is a logged skip rather than a failure.
          set +e
          ./scripts/check-host-kit-protocol-drift.sh --self-test && ./scripts/check-host-kit-protocol-drift.sh
          status=$?
          set -e
          if [ "$status" -eq 2 ]; then
            echo "::warning::host-kit/protocol drift check skipped — crates.io state unobtainable"
            exit 0
          fi
          exit "$status"

  release-tags:
    name: every version tag has a Release and /releases/latest is newest
    runs-on: ubuntu-latest
    # C-47/N-001: `scripts/verify-github-release.sh` runs inside the Release workflow and guards the
    # ONE tag being cut — so a tag whose workflow died before that step never reaches it, and the
    # drift then sits in history unnoticed (N-001 was found by an external tester, not by CI). This
    # job audits the whole fleet on every push to main instead, and additionally pins the invariant
    # nothing checked at all: `/releases/latest` is ranked by `published_at`, so publishing an old
    # tag's Release repoints it at that old version. Backfilling v0.9.3 on 2026-07-29 did exactly
    # that to v0.33.0 until it was repaired.
    #
    # C-252: this job and the Release workflow are independent, so a cut is always observed
    # mid-flight from here — the audit on `cedef3f4` went red 74 seconds before v0.36.0's Release
    # published. The script now asks GitHub whether that tag's Release run is still going and logs a
    # NOTE instead of failing, which is why it needs `actions: read`. Declaring permissions here
    # replaces the repo default for this job only, so `contents: read` (for checkout) is explicit.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Every version tag has a Release, and /releases/latest is the newest one
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Live GitHub state, not this tree's — see the script header for why exit 2 (data
          # unobtainable, e.g. a GitHub outage) is a logged skip rather than a failure.
          set +e
          ./scripts/check-release-tags.sh --self-test && ./scripts/check-release-tags.sh
          status=$?
          set -e
          if [ "$status" -eq 2 ]; then
            echo "::warning::release-tag audit skipped — GitHub release state unobtainable"
            exit 0
          fi
          exit "$status"

  plugin-compat:
    name: released plugin binaries vs this host
    runs-on: ubuntu-latest
    # flux and the plugin pack no longer share a version line (C-143): plugins depend on the 1.x
    # wire contract and are rebuilt only when it changes. Every other job builds host and guest from
    # the same commit, so none of them can catch "today's host stopped understanding yesterday's
    # binary". This one points a real, already-shipped artifact at the current host.
    #
    # C-166: "the newest release" is only an across-time check by accident — a pack cut minutes
    # after the host it will be tested against proves nothing a same-tree build wouldn't. So this
    # job runs the script TWICE, as two separate assertions that are never merged into one
    # PASS/FAIL:
    #   1. pinned at COMPAT_BASELINE_TAG, a pack that predates `crates/flux-plugin-protocol`
    #      existing as its own crate (verified: `git merge-base --is-ancestor d19212f
    #      <that tag's commit>` fails) — the genuine cross-generation guarantee this job exists
    #      to make. If this tag is ever pruned from the release list, or the wire moves to a new
    #      PROTOCOL marker, repin it to the oldest surviving `plugins-v*` release whose
    #      `plugins-index.json` `protocol` field still equals
    #      `crates/flux-plugin-protocol/src/lib.rs`'s `PROTOCOL` constant.
    #   2. the newest pack (no PACK_TAG override — the script's own default resolution), which is
    #      still worth knowing works, but proves something weaker and must not be read as #1.
    env:
      COMPAT_BASELINE_TAG: plugins-v0.1.1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          # `master` pins the action's code (C-187); `toolchain` is now a required explicit input.
          toolchain: "1.97.0"

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: "Baseline (cross-time): a pack older than the protocol crate still speaks this host's protocol"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACK_TAG: ${{ env.COMPAT_BASELINE_TAG }}
        # Exit 2 means the pack release genuinely could not be obtained — reported, not failed.
        # An actual incompatibility exits 1 and fails the job.
        run: |
          # GitHub runs this block under `bash -e`, which would abort on the script's own non-zero
          # exit before the status could be read at all — turning a skip into a failed job.
          set +e
          ./scripts/check-plugin-compat.sh
          status=$?
          set -e
          if [ "$status" -eq 2 ]; then
            echo "::warning::plugin compatibility baseline check skipped — $COMPAT_BASELINE_TAG unavailable"
            exit 0
          fi
          exit "$status"

      - name: "Newest pack (separate, second assertion): still speaks this host's protocol"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          ./scripts/check-plugin-compat.sh
          status=$?
          set -e
          if [ "$status" -eq 2 ]; then
            echo "::warning::plugin compatibility check skipped — no pack release available"
            exit 0
          fi
          exit "$status"

  postgres:
    name: postgres backend · flux-events · flux-capabilities · flux-pg
    runs-on: ubuntu-latest
    # The opt-in Postgres backends (`pg-backend` epic) are behind the `postgres` feature; the default
    # `check` job above builds DB-free and never exercises them. This job spins up a throwaway
    # Postgres and runs the feature-gated crates against it — the ONLY job that needs a database.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: flux
          POSTGRES_PASSWORD: flux
          POSTGRES_DB: flux
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flux"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Env-gated tests connect here; each test isolates itself in a throwaway `?schema=t_<ulid>`.
      TEST_POSTGRES_URL: postgres://flux:flux@localhost:5432/flux
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Rust toolchain
        # Pinned, not `stable`: every Rust release ships new clippy lints that `-D warnings`
        # promotes to errors, so a floating CI toolchain breaks on code that is clean locally
        # (hit on the 1.96→1.97 bump, 2026-07-09). To bump: update the version here, run
        # both-workspace clippy/fmt locally on that same version, fix, commit.
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          # `master` above pins the action's code (C-187); `toolchain` is now an explicit (required)
          # input rather than carried by the ref.
          toolchain: "1.97.0"
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      # `flux-pg` is always Postgres (no `postgres` feature to toggle); the two backend crates gate it.
      # NB: flux-pg, flux-events, and flux-capabilities are in the crates.io publish closure, so their
      # *package* names carry the `codewandler-` vanity prefix (import paths stay bare). See
      # crates/flux-sdk/PUBLISHING.md.
      - name: Clippy (postgres feature, deny warnings)
        run: |
          scripts/owned-cargo clippy -p codewandler-flux-pg --all-targets -- -D warnings
          scripts/owned-cargo clippy -p codewandler-flux-events -p codewandler-flux-capabilities --features postgres --all-targets -- -D warnings

      - name: Test flux-pg (bridge + pool + DSN)
        run: scripts/owned-cargo test -p codewandler-flux-pg

      - name: Test Postgres backends (flux-events + flux-capabilities)
        run: scripts/owned-cargo test -p codewandler-flux-events -p codewandler-flux-capabilities --features postgres
