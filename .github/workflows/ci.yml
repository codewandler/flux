name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Note: deliberately NOT setting `RUSTFLAGS: -D warnings` globally — that would also deny warnings
  # in third-party dependencies, breaking CI on any upstream warning or new rustc lint. Warning
  # enforcement for our own code lives in the clippy step below (`-- -D warnings`).

jobs:
  check:
    name: build · test · clippy · fmt · layering
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Rust toolchain
        # Pinned, not `stable`: every Rust release ships new clippy lints that `-D warnings`
        # promotes to errors, so a floating CI toolchain breaks on code that is clean locally
        # (hit on the 1.96→1.97 bump, 2026-07-09). To bump: update the version here, run
        # both-workspace clippy/fmt locally on that same version, fix, commit.
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          # `master` above pins the action's *code* to a commit (C-187); the toolchain the tag used
          # to encode is now an explicit — and, at this SHA, required — input. To bump: change the
          # version here, run both-workspace clippy/fmt on it, fix, commit.
          toolchain: "1.97.0"
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      # The layering lint runs `cargo metadata --locked --offline`, which needs every lockfile
      # dep's manifest locally — including other-target deps (e.g. android_system_properties) that
      # `cargo build` never downloads on this runner. Fetch the full locked closure up front so a
      # fresh cache (any Cargo.lock change) can't fail the lint.
      - name: Fetch locked dependencies (all targets)
        run: cargo fetch --locked

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace

      # The architecture lint (fluxplane `codegate` analog): inner crates must not depend on outer
      # layers. Run explicitly too so a layering regression is an obvious, named failure.
      - name: Architecture layering lint
        run: cargo test -p flux-codegate

      # Hermetic drift guard for the live smoke gate (C-39): re-runs steps 1-5's invocation *shapes*
      # from scripts/smoke-live.sh against the offline `mock` provider — no credentials, no live
      # spend — so a future CLI-surface change (renamed subcommand, dropped flag) fails here instead
      # of only being caught the next time someone remembers to run the real live gate by hand.
      - name: Live smoke gate — CLI shape guard (hermetic, no credentials)
        run: FLUX_BIN="$PWD/target/debug/flux" ./scripts/smoke-live.sh --shapes

  plugins:
    name: plugins workspace · build · test · clippy · fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Rust toolchain
        # Pinned, not `stable`: every Rust release ships new clippy lints that `-D warnings`
        # promotes to errors, so a floating CI toolchain breaks on code that is clean locally
        # (hit on the 1.96→1.97 bump, 2026-07-09). To bump: update the version here, run
        # both-workspace clippy/fmt locally on that same version, fix, commit.
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          # `master` above pins the action's *code* to a commit (C-187); the toolchain the tag used
          # to encode is now an explicit — and, at this SHA, required — input. To bump: change the
          # version here, run both-workspace clippy/fmt on it, fix, commit.
          toolchain: "1.97.0"
          components: rustfmt, clippy

      # The integration plugin pack (D-08) is a nested cargo workspace, EXCLUDED from the root workspace
      # (heavy vendor deps), so the `check` job above never builds it — gate it here in its own job.
      - name: Cache cargo (plugins)
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: plugins

      - name: Format
        working-directory: plugins
        run: cargo fmt --all --check

      - name: Clippy (deny warnings)
        working-directory: plugins
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        working-directory: plugins
        run: cargo build --workspace

      - name: Test
        working-directory: plugins
        run: cargo test --workspace

  crate-versions:
    name: independently-versioned crates moved their version
    runs-on: ubuntu-latest
    # The other half of dropping the lockstep (C-146). Crates on the 1.x protocol line are NOT swept
    # by `scripts/cut-release.sh`, so nothing else stops an edit shipping under a version already on
    # crates.io — where `cargo publish` would skip it and every consumer would keep the old code.
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0 # the check diffs against the previous v* tag

      - name: A changed crate on an independent version line changed its version
        run: |
          ./scripts/check-crate-versions.sh --self-test
          ./scripts/check-crate-versions.sh

  action-pins:
    name: third-party actions are pinned to a commit SHA
    runs-on: ubuntu-latest
    # C-187: a `uses:` on a movable tag hands whoever controls that upstream tag the code running in
    # our workflows — including release.yml (crates.io publish) and release-plugins.yml (the Minisign
    # signing key). Fail CI the moment an unpinned action reappears. Runs on the checkout only, so no
    # Rust build is needed.
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Every third-party action names a full commit SHA
        run: |
          ./scripts/check-action-pins.sh --self-test
          ./scripts/check-action-pins.sh

  host-kit-protocol-drift:
    name: published host-kit is not behind the live protocol version
    runs-on: ubuntu-latest
    # C-167: the ordering preflight in release-plugins.yml and the crate-versions job above both
    # watch for COMMISSIONS (a wrong publish order; a changed-but-unbumped crate). Neither catches
    # an OMISSION — a flux release publishing a newer `codewandler-flux-plugin-protocol` while
    # nobody runs the pack workflow to publish a `codewandler-flux-host-kit` that depends on it.
    # This runs on every push to main (i.e. every flux release commit), not only inside the pack
    # workflow that may never be dispatched — so a flux cut tells you a pack release is now owed.
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Published host-kit's protocol requirement is not behind the live protocol version
        run: |
          # Live crates.io state, not this tree's — see the script header for why exit 2 (data
          # unobtainable, e.g. a crates.io outage) is a logged skip rather than a failure.
          set +e
          ./scripts/check-host-kit-protocol-drift.sh --self-test && ./scripts/check-host-kit-protocol-drift.sh
          status=$?
          set -e
          if [ "$status" -eq 2 ]; then
            echo "::warning::host-kit/protocol drift check skipped — crates.io state unobtainable"
            exit 0
          fi
          exit "$status"

  release-tags:
    name: every version tag has a Release and /releases/latest is newest
    runs-on: ubuntu-latest
    # C-47/N-001: `scripts/verify-github-release.sh` runs inside the Release workflow and guards the
    # ONE tag being cut — so a tag whose workflow died before that step never reaches it, and the
    # drift then sits in history unnoticed (N-001 was found by an external tester, not by CI). This
    # job audits the whole fleet on every push to main instead, and additionally pins the invariant
    # nothing checked at all: `/releases/latest` is ranked by `published_at`, so publishing an old
    # tag's Release repoints it at that old version. Backfilling v0.9.3 on 2026-07-29 did exactly
    # that to v0.33.0 until it was repaired.
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Every version tag has a Release, and /releases/latest is the newest one
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Live GitHub state, not this tree's — see the script header for why exit 2 (data
          # unobtainable, e.g. a GitHub outage) is a logged skip rather than a failure.
          set +e
          ./scripts/check-release-tags.sh --self-test && ./scripts/check-release-tags.sh
          status=$?
          set -e
          if [ "$status" -eq 2 ]; then
            echo "::warning::release-tag audit skipped — GitHub release state unobtainable"
            exit 0
          fi
          exit "$status"

  plugin-compat:
    name: released plugin binaries vs this host
    runs-on: ubuntu-latest
    # flux and the plugin pack no longer share a version line (C-143): plugins depend on the 1.x
    # wire contract and are rebuilt only when it changes. Every other job builds host and guest from
    # the same commit, so none of them can catch "today's host stopped understanding yesterday's
    # binary". This one points a real, already-shipped artifact at the current host.
    #
    # C-166: "the newest release" is only an across-time check by accident — a pack cut minutes
    # after the host it will be tested against proves nothing a same-tree build wouldn't. So this
    # job runs the script TWICE, as two separate assertions that are never merged into one
    # PASS/FAIL:
    #   1. pinned at COMPAT_BASELINE_TAG, a pack that predates `crates/flux-plugin-protocol`
    #      existing as its own crate (verified: `git merge-base --is-ancestor d19212f
    #      <that tag's commit>` fails) — the genuine cross-generation guarantee this job exists
    #      to make. If this tag is ever pruned from the release list, or the wire moves to a new
    #      PROTOCOL marker, repin it to the oldest surviving `plugins-v*` release whose
    #      `plugins-index.json` `protocol` field still equals
    #      `crates/flux-plugin-protocol/src/lib.rs`'s `PROTOCOL` constant.
    #   2. the newest pack (no PACK_TAG override — the script's own default resolution), which is
    #      still worth knowing works, but proves something weaker and must not be read as #1.
    env:
      COMPAT_BASELINE_TAG: plugins-v0.1.1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          # `master` pins the action's code (C-187); `toolchain` is now a required explicit input.
          toolchain: "1.97.0"

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: "Baseline (cross-time): a pack older than the protocol crate still speaks this host's protocol"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACK_TAG: ${{ env.COMPAT_BASELINE_TAG }}
        # Exit 2 means the pack release genuinely could not be obtained — reported, not failed.
        # An actual incompatibility exits 1 and fails the job.
        run: |
          # GitHub runs this block under `bash -e`, which would abort on the script's own non-zero
          # exit before the status could be read at all — turning a skip into a failed job.
          set +e
          ./scripts/check-plugin-compat.sh
          status=$?
          set -e
          if [ "$status" -eq 2 ]; then
            echo "::warning::plugin compatibility baseline check skipped — $COMPAT_BASELINE_TAG unavailable"
            exit 0
          fi
          exit "$status"

      - name: "Newest pack (separate, second assertion): still speaks this host's protocol"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          ./scripts/check-plugin-compat.sh
          status=$?
          set -e
          if [ "$status" -eq 2 ]; then
            echo "::warning::plugin compatibility check skipped — no pack release available"
            exit 0
          fi
          exit "$status"

  postgres:
    name: postgres backend · flux-events · flux-capabilities · flux-pg
    runs-on: ubuntu-latest
    # The opt-in Postgres backends (`pg-backend` epic) are behind the `postgres` feature; the default
    # `check` job above builds DB-free and never exercises them. This job spins up a throwaway
    # Postgres and runs the feature-gated crates against it — the ONLY job that needs a database.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: flux
          POSTGRES_PASSWORD: flux
          POSTGRES_DB: flux
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flux"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Env-gated tests connect here; each test isolates itself in a throwaway `?schema=t_<ulid>`.
      TEST_POSTGRES_URL: postgres://flux:flux@localhost:5432/flux
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Rust toolchain
        # Pinned, not `stable`: every Rust release ships new clippy lints that `-D warnings`
        # promotes to errors, so a floating CI toolchain breaks on code that is clean locally
        # (hit on the 1.96→1.97 bump, 2026-07-09). To bump: update the version here, run
        # both-workspace clippy/fmt locally on that same version, fix, commit.
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          # `master` above pins the action's code (C-187); `toolchain` is now an explicit (required)
          # input rather than carried by the ref.
          toolchain: "1.97.0"
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      # `flux-pg` is always Postgres (no `postgres` feature to toggle); the two backend crates gate it.
      # NB: flux-pg, flux-events, and flux-capabilities are in the crates.io publish closure, so their
      # *package* names carry the `codewandler-` vanity prefix (import paths stay bare). See
      # crates/flux-sdk/PUBLISHING.md.
      - name: Clippy (postgres feature, deny warnings)
        run: |
          cargo clippy -p codewandler-flux-pg --all-targets -- -D warnings
          cargo clippy -p codewandler-flux-events -p codewandler-flux-capabilities --features postgres --all-targets -- -D warnings

      - name: Test flux-pg (bridge + pool + DSN)
        run: cargo test -p codewandler-flux-pg

      - name: Test Postgres backends (flux-events + flux-capabilities)
        run: cargo test -p codewandler-flux-events -p codewandler-flux-capabilities --features postgres
