name: website

on:
  # NO `paths` filter on main, deliberately: the published site tracks `main`, so anything that can
  # change a rendered page must redeploy. That is wider than `website/**` — the generated blocks in
  # `website/docs/**` are synced from crate sources, and a doc edit paired with a code change would
  # otherwise land a half-updated site. A docs build is a couple of minutes; a stale public page that
  # contradicts the tree costs more.
  push:
    branches: [main]
  # Pull requests stay path-filtered and never deploy — they are build validation only.
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - run: npm ci
        working-directory: website
      # Builds the ordinary deployable site and proves the compressed snapshot linked into the
      # distributed CLI came from exactly the same source. A website edit cannot ship only to one.
      - run: scripts/build-embedded-docs.sh --check
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        # The published site tracks `main`, not the latest release tag. This reverses the earlier
        # policy on purpose: docs that describe an unreleased change are a smaller problem than docs
        # that silently contradict the tree for however long the next release takes. The consequence
        # is real and accepted — the site can document behaviour not yet in a released binary, so
        # anything version-sensitive on a page has to say which version it needs.
        # Pull requests still never deploy; `release` and `workflow_dispatch` remain so a tag and a
        # manual recovery both republish.
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/main')
          || github.event_name == 'release'
          || github.event_name == 'workflow_dispatch'
        with:
          path: website/build

  deploy:
    # Must stay in lockstep with the upload-pages-artifact condition above: if this job runs without
    # an artifact having been uploaded, deploy-pages fails with a confusing "no artifact" error
    # rather than skipping.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || github.event_name == 'release'
      || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
