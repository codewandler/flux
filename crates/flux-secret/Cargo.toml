[package]
name = "codewandler-flux-secret"
edition.workspace = true
# PROTOCOL LINE (C-143), not the flux workspace version: secret purposes named by a plugin manifest,
# so a plugin built against 1.x keeps resolving across flux releases. Moves only when the
# wire vocabulary changes — scripts/cut-release.sh never touches it.
# 1.1.0 (C-315): additive — `try_add_secret`, `Unregistered`, `MIN_REGISTERED_SECRET_LEN`. The wire
# vocabulary is unchanged, so a plugin pinned to `1` keeps resolving; the bump is what
# scripts/check-crate-versions.sh requires of a published crate whose content moved.
# 1.1.1 (C-325): four unit-test credential literals joined by `concat!` so they stop matching a
# secret-scanning rule. Compile-time, so the published rlib is byte-identical and no API moved —
# the bump is only what check-crate-versions.sh requires of a published crate whose content moved.
# 1.2.0 (C-312): additive — `Redactor::credential_shape`, `CredentialShape`, and `names_a_secret` /
# `is_opaque_material` promoted to `pub`. `redact` is unchanged behaviourally: it and
# `credential_shape` are now two views of one private `scrub` pipeline, pinned by
# `a_reported_shape_and_a_changed_text_are_the_same_fact`. Nothing was removed or renamed and the
# secret-purpose wire vocabulary did not move, so a plugin pinned to `1` keeps resolving.
version = "1.2.0"
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "flux secret references, material, sensitivity, and log/output redaction (pure)"

[lib]
name = "flux_secret"

[dependencies]
serde.workspace = true

[dev-dependencies]
serde_json.workspace = true
toml.workspace = true
