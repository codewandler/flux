[package]
name = "codewandler-flux-agent"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "flux Agent pillar: agent definitions (AgentSpec, markdown Roles) assembled onto the flux-flow engine"

[lib]
name = "flux_agent"

[dependencies]
flux-core.workspace = true
flux-provider.workspace = true
flux-runtime.workspace = true
flux-system.workspace = true
# The embedded SQLite backend is asked for explicitly: the workspace entry turns default
# features off so flux-flow can shed the driver (C-274) — see the root Cargo.toml.
flux-events = { workspace = true, features = ["sqlite"] }
flux-evidence.workspace = true
flux-skill.workspace = true
flux-flow.workspace = true
flux-tools.workspace = true
flux-markdown.workspace = true
serde.workspace = true
serde_norway.workspace = true

[dev-dependencies]
flux-policy.workspace = true
flux-spec.workspace = true
flux-system.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
