[package]
name = "codewandler-flux-plugin"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
description = "flux subprocess plugin protocol + host + SDK: any-language plugins over framed (NDJSON) stdio"

[lib]
name = "flux_plugin"

# The `echo_plugin` / `caps_plugin` binaries are protocol test fixtures, not shippable artifacts.
[package.metadata.dist]
dist = false

[dependencies]
flux-core.workspace = true
flux-datasource.workspace = true
flux-lang.workspace = true
flux-runtime.workspace = true
flux-spec.workspace = true
flux-system.workspace = true
flux-secret.workspace = true
flux-credentials.workspace = true
flux-evidence.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
async-trait.workspace = true
reqwest.workspace = true
base64.workspace = true
sha2.workspace = true
# Host-terminated Postgres SCRAM-SHA-256 handshake (D-31): HMAC-SHA256 + SHA-256 + a random client
# nonce. PBKDF2 is a short HMAC loop implemented in `pg.rs`, not a separate crate.
hmac.workspace = true
rand.workspace = true
url.workspace = true
toml.workspace = true
rquickjs.workspace = true
# Plugin pack distribution (D-47, `pack` module): verified fetch-and-install from the signed
# `plugins-v*` release channel. See `pack.rs` module docs for the trust ladder.
minisign-verify.workspace = true
tar.workspace = true
lzma-rs.workspace = true
zip.workspace = true

[dev-dependencies]
tokio.workspace = true
async-trait.workspace = true
flux-runtime.workspace = true
flux-system.workspace = true
# Signs fixtures in `pack.rs`'s hermetic tests (never a runtime dep) and generates the production
# keypair via the ignored `generate_pack_keypair` helper test.
minisign.workspace = true

[[bin]]
name = "echo_plugin"
path = "src/bin/echo_plugin.rs"

[[bin]]
name = "caps_plugin"
path = "src/bin/caps_plugin.rs"
