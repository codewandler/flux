[package]
name = "flux-lsp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Language Server (LSP) for Flux-Lang — diagnostics, completion, hover, formatting, document symbols, go-to-definition, and semantic tokens."

# Shipped as a release binary alongside `flux` (L-70): dist builds the `flux-lsp` binary for every
# release target so editors can install it without a Rust toolchain.
[package.metadata.dist]
dist = true

[[bin]]
name = "flux-lsp"
path = "src/main.rs"

[dependencies]
flux-lang.workspace = true
flux-flow.workspace = true
flux-tools.workspace = true
flux-runtime.workspace = true
flux-provider.workspace = true
flux-cognition.workspace = true
flux-capabilities.workspace = true
flux-web.workspace = true
tower-lsp.workspace = true
tokio = { workspace = true }
serde_json.workspace = true
text-size.workspace = true
