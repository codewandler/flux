[package]
name = "flux-lsp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Language Server (LSP) for Flux-Lang — diagnostics, completion, hover, formatting."

# Not a release artifact yet — build from source (`cargo build -p flux-lsp`). Shipping binaries
# is part of the packaging story (L-70).
[package.metadata.dist]
dist = false

[[bin]]
name = "flux-lsp"
path = "src/main.rs"

[dependencies]
flux-lang.workspace = true
flux-flow.workspace = true
flux-tools.workspace = true
flux-runtime.workspace = true
tower-lsp.workspace = true
tokio = { workspace = true }
serde_json.workspace = true
