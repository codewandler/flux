[package]
name = "codewandler-flux-capabilities"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "flux agent capabilities: a guarded web_fetch tool (browser) + a knowledge datasource (records, a pluggable backend, and retrieval ops)"

[dependencies]
flux-core.workspace = true
flux-datasource.workspace = true
flux-plugin.workspace = true
flux-runtime.workspace = true
flux-secret.workspace = true
flux-spec.workspace = true
flux-system.workspace = true
rusqlite.workspace = true
url.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
# The endpoint broker (D-26) holds plugin hosts behind `tokio::sync::Mutex` and guards re-entrancy
# with an async mutex, so tokio is a runtime dependency here (not just for tests).
tokio.workspace = true
# Embeddings (optional): a runtime-free blocking HTTP client for the synchronous `Embedder` seam — NOT
# reqwest::blocking, which spins its own runtime and panics when called from within tokio.
ureq = { version = "2", optional = true, features = ["json"] }
# Local CPU embeddings (optional, D-51): an in-process ONNX text-embedding model (bge-small, 384-dim).
# Off by default — pulls ONNX Runtime; enable only where local semantic search is wanted.
fastembed = { version = "4", optional = true }
# Durable vector store (optional, D-51): the sqlite-vec loadable extension, so vectors persist in a
# SQLite `vec0` table co-located with the records (no external DB).
sqlite-vec = { version = "0.1", optional = true }
# Postgres datasource backend (optional, D-74): the shared Postgres driver-owner. Off by default —
# the default build stays DB-free (no sqlx). sqlx is reached through `flux_pg::sqlx`, never declared
# here directly, so there is exactly one sqlx in the tree.
flux-pg = { workspace = true, optional = true }

[features]
# Wire the semantic/embeddings datasource backend (the `OpenAiEmbedder` over /v1/embeddings). Off by
# default — the keyword path and the whole default gate are unchanged.
embeddings = ["dep:ureq"]
# The in-process local CPU embedder (`FastEmbedEmbedder`). Off by default (heavy ONNX dep).
local-embeddings = ["dep:fastembed"]
# The durable `sqlite-vec`-backed `VectorStore` (`SqliteVecStore`). Off by default.
sqlite-vec = ["dep:sqlite-vec"]
# The Postgres `PostgresBackend` for the datasource trait (D-74). Off by default — pulls the
# `flux-pg` driver-owner (sqlx/tokio). Tests are gated on `TEST_POSTGRES_URL`.
postgres = ["dep:flux-pg"]

[dev-dependencies]
tokio.workspace = true
# Unique throwaway schema names (`?schema=t_<ulid>`) for the env-gated Postgres conformance tests.
ulid.workspace = true
