[package]
name = "flux-tui"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "flux ratatui chat UI: streaming chat view + input, driving the agent loop"

[dependencies]
flux-core.workspace = true
# C-512: consume the shared usage timeline/projection; never depend on flux-cli.
flux-capabilities.workspace = true
flux-credentials.workspace = true
flux-flow.workspace = true
flux-provider.workspace = true
flux-runtime.workspace = true
jsonschema.workspace = true
flux-spec.workspace = true
# C-182: the plan-approval sheet reads typed authority requirements (`ResourceKind`) off the
# approval request so it can name what a plan will touch.
flux-policy.workspace = true
flux-evidence.workspace = true
# The embedded SQLite backend is asked for explicitly: the workspace entry turns default
# features off so flux-flow can shed the driver (C-274) — see the root Cargo.toml.
flux-events = { workspace = true, features = ["sqlite"] }
ratatui.workspace = true
crossterm = { workspace = true, features = ["event-stream"] }
anyhow.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
async-trait.workspace = true
futures-util.workspace = true
unicode-width = "0.2"
# C-115 hunk-view diffs (word-level intraline needs the non-default `inline` feature).
similar = { workspace = true, features = ["inline"] }
# C-111 OSC 52 clipboard writes.
base64.workspace = true

# Markdown rendering for the transcript goes through flux-markdown's `ratatui` feature, which wraps
# markdown-stream (parse) + markdown-ratatui (render natively to ratatui `Text`, no ANSI round-trip).
# ansi-to-tui now only converts the flux-flow plan-tree ANSI (see plan.rs).
flux-markdown = { workspace = true, features = ["ratatui"] }
# ansi-to-tui 8 targets ratatui 0.30; the workspace holds ratatui at 0.29 (see the root
# Cargo.toml comment). Range req so `task deps:upgrade` skips it; lift together with ratatui.
ansi-to-tui = ">=7, <8"
tui-textarea = "0.7"
