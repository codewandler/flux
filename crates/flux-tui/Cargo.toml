[package]
name = "flux-tui"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "flux ratatui chat UI: streaming chat view + input, driving the agent loop"

[dependencies]
flux-core.workspace = true
flux-credentials.workspace = true
flux-flow.workspace = true
flux-provider.workspace = true
flux-runtime.workspace = true
flux-spec.workspace = true
flux-evidence.workspace = true
flux-events.workspace = true
ratatui.workspace = true
crossterm = { workspace = true, features = ["event-stream"] }
anyhow.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
async-trait.workspace = true
futures-util.workspace = true
unicode-width = "0.2"

# Markdown rendering for the transcript goes through flux-markdown's `ratatui` feature, which wraps
# markdown-stream (parse) + markdown-ratatui (render natively to ratatui `Text`, no ANSI round-trip).
# ansi-to-tui now only converts the flux-flow plan-tree ANSI (see plan.rs).
flux-markdown = { workspace = true, features = ["ratatui"] }
# ansi-to-tui 8 targets ratatui 0.30; the workspace holds ratatui at 0.29 (see the root
# Cargo.toml comment). Range req so `task deps:upgrade` skips it; lift together with ratatui.
ansi-to-tui = ">=7, <8"
tui-textarea = "0.7"
