[package]
name = "codewandler-flux-events"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "flux unified append-only event store: one ordered log projected into conversations, run traces, and turn metrics (SQLite/WAL)"

[features]
default = ["sqlite"]
# The embedded SQLite backend — ON by default, so every existing consumer builds and behaves exactly
# as before and gains no build step (C-274). Turning it OFF is what lets the store — and therefore
# `flux-flow`, which holds `Arc<EventStore>` in `FlowStore`'s public signature — build for a target
# `rusqlite` cannot reach, `wasm32-unknown-unknown` above all: the driver links a C library. A
# feature-off build keeps a usable `EventBackend` (the driver-free `EphemeralEvents`, which
# `EventStore::in_memory` then resolves to), so it is a portable store rather than no store at all.
# Durability is what it gives up: `EventStore::open` needs this feature, because a non-durable store
# behind a path-taking constructor would be a lie rather than a fallback.
sqlite = ["dep:rusqlite"]
# Opt-in Postgres backend for the EventStore (D-73). The default build stays DB-free and
# rusqlite-only: `flux-pg` (the sole sqlx owner) is pulled in only when this feature is on.
postgres = ["dep:flux-pg"]
# Opt-in OpenTelemetry export (C-129): a pure-consumer projection of the event log into an OTLP
# span tree + metrics. Adds NO new Cargo dependency at all (gated or not) — see `src/otel.rs`'s
# module doc for why the OTLP/HTTP-JSON client is hand-rolled over `std::net::TcpStream` rather
# than the official `opentelemetry`/`opentelemetry-otlp` crates. The only thing this feature turns
# on is `flux-secret` (already an L0 leaf, already a dev-dependency below) as a REAL dependency, so
# span/metric attributes can be redacted the same way every other observation surface is.
otel = ["dep:flux-secret"]

[lib]
name = "flux_events"

[dependencies]
flux-core.workspace = true
flux-lang.workspace = true
flux-evidence.workspace = true
serde.workspace = true
serde_json.workspace = true
ulid.workspace = true
# C-124: a visible trace when an append waits on the SQLite busy handler past a threshold. No
# product surface is required to install a subscriber (mirrors `flux-provider`'s retry warnings) —
# a silent contended writer stays silent by default, but any embedder that wires up `tracing` sees it.
tracing.workspace = true
# The embedded SQLite driver — the default backend's driver-owner. Optional: gated behind `sqlite`
# (on by default), because it links a C library and so cannot build for `wasm32-unknown-unknown`;
# see that feature's comment (C-274).
rusqlite = { workspace = true, optional = true }
# The Postgres driver-owner (sqlx + pool + sync↔async bridge). Optional: gated behind `postgres`.
flux-pg = { workspace = true, optional = true }
# The Redactor the `otel` exporter scrubs span/metric attributes through. Optional: gated behind
# `otel`. (Already present as a dev-dependency below for the C-164 test; this makes it a real,
# feature-gated production dependency too — flux-secret is an L0 leaf, so no layering concern.)
flux-secret = { workspace = true, optional = true }

[dev-dependencies]
# For the PG-only concurrent-append conformance test, which drives `store.append` from a
# multi-thread tokio context to prove the advisory lock + the flux-pg bridge together. Only
# referenced from the `postgres`-gated test module; harmless to the default build.
tokio.workspace = true
# C-164: the session-search redaction conformance test seeds a session exactly the way
# `flux-flow`'s `flush_observations` does in production (scrub through `Redactor` BEFORE the
# store ever sees the payload), to prove a secret's plaintext can never be used as a search term
# that confirms the redacted session's existence. flux-secret is an L0 leaf, so this is a
# dev-only, test-scoped reference — no production dependency on redaction semantics.
flux-secret.workspace = true
