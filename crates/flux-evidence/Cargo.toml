[package]
name = "codewandler-flux-evidence"
edition.workspace = true
# PROTOCOL LINE (C-143), not the flux workspace version: ToolGroup/SignalMatch travel in a plugin manifest,
# so a plugin built against 1.x keeps resolving across flux releases. Moves only when the
# wire vocabulary changes — scripts/cut-release.sh never touches it.
# 1.1.0 (C-298): additive only — `EvidenceLog`'s retained-payload ceiling and the elision marker.
# The serialized record's shape is unchanged, so a plugin built against 1.0 keeps resolving.
version = "1.1.0"
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "flux evidence: typed observations at lifecycle phases, an evidence log, and reactions"

[lib]
name = "flux_evidence"

[dependencies]
serde.workspace = true
serde_json.workspace = true
