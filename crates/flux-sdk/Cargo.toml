[package]
name = "codewandler-flux-sdk"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "flux high-level library API: build a tool-enabled, policy-gated agent and run turns"
readme = "README.md"
documentation = "https://docs.rs/codewandler-flux-sdk"
keywords = ["agent", "llm", "ai", "tools", "flux"]
categories = ["development-tools", "api-bindings"]

[lib]
name = "flux_sdk"

[dependencies]
flux-core.workspace = true
flux-provider.workspace = true
flux-runtime.workspace = true
flux-system.workspace = true
flux-tools.workspace = true
flux-events.workspace = true
flux-agent.workspace = true
# Flux-Lang lifecycle surface: the L0 language (artifact prelude), the L3 engine (compile/analyze/
# execute), and the L3 model-op pack wired into the assembled registry.
flux-lang.workspace = true
flux-flow.workspace = true
flux-cognition.workspace = true
# L3 sub-agent orchestration: the reusable `SubAgents` wiring + the `task` tool, surfaced through
# `FlowClient::with_sub_agents` so a consumer drives sub-agents without re-assembling the spawner.
flux-orchestrate.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
# `run_voice_session` takes a cancel token to end a full-duplex voice session.
tokio-util.workspace = true
# The client's turn guard (`sync::Mutex`) — one engine runs one turn at a time — and the spawned
# streaming turns.
tokio.workspace = true
# Custom tools/approvers are part of the public surface (`register_op`, `approver`): implementing
# `Tool::spec()`/`Approver::request` needs `ToolSpec`/`IntentSet`, so the spec contracts are a real
# dependency (re-exported via `flux_sdk::tools`/`flux_sdk::approval`).
flux-spec.workspace = true
# `AgentEvent::Observation` carries the audit observation type (and the evidence-gated `ToolGroup`
# rides the re-export surface) — L0 contracts, like flux-spec above.
flux-evidence.workspace = true
# `TurnStream` implements `futures::Stream` (the async-iterator shape of a live turn).
futures.workspace = true
# Optional (feature `pricing`): the `~/.flux/pricing.toml` loader behind `flux_sdk::pricing`, so a
# consumer gets `Session::cost` ergonomics without re-implementing the built-in-plus-overlay resolve.
# The provider-agnostic default build (`default = []`) pulls none of this.
flux-credentials = { workspace = true, optional = true }

[features]
default = []
# `flux_sdk::pricing::load_pricing_table()` — the built-in rate table overlaid by the user's
# `~/.flux/pricing.toml`, for `Session::cost`.
pricing = ["dep:flux-credentials"]

[dev-dependencies]
