[package]
name = "codewandler-flux-sdk"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "flux high-level library API: build a tool-enabled, policy-gated agent and run turns"
readme = "README.md"
documentation = "https://docs.rs/codewandler-flux-sdk"
keywords = ["agent", "llm", "ai", "tools", "flux"]
categories = ["development-tools", "api-bindings"]

# flux-sdk ships no release binary — the only `[[bin]]` is the `plugins`-feature test fixture
# (`flux_sdk_plugin_fixture`), which `required-features` keeps out of a default build. cargo-dist
# enumerates every workspace bin for the release, though, and can't find that feature-gated one — so
# exclude this (library-only) package from the binary release, exactly as flux-lsp/flux-plugin do.
[package.metadata.dist]
dist = false

[lib]
name = "flux_sdk"

[dependencies]
flux-core.workspace = true
flux-provider.workspace = true
flux-runtime.workspace = true
flux-policy.workspace = true
flux-secret.workspace = true
flux-system.workspace = true
flux-tools.workspace = true
flux-events.workspace = true
flux-agent.workspace = true
# Flux-Lang lifecycle surface: the L0 language (artifact prelude), the L3 engine (compile/analyze/
# execute), and the L3 model-op pack wired into the assembled registry.
flux-lang.workspace = true
flux-flow.workspace = true
flux-cognition.workspace = true
# L3 sub-agent orchestration: the reusable `SubAgents` wiring + the `task` tool, surfaced through
# `FlowClient::with_sub_agents` so a consumer drives sub-agents without re-assembling the spawner.
flux-orchestrate.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
# `run_voice_session` takes a cancel token to end a full-duplex voice session.
tokio-util.workspace = true
# The client's turn guard (`sync::Mutex`) — one engine runs one turn at a time — and the spawned
# streaming turns.
tokio.workspace = true
# Custom tools/approvers are part of the public surface (`register_op`, `approver`): implementing
# `Tool::spec()`/`Approver::request` needs `ToolSpec`/`IntentSet`, so the spec contracts are a real
# dependency (re-exported via `flux_sdk::tools`/`flux_sdk::approval`).
flux-spec.workspace = true
# `AgentEvent::Observation` carries the audit observation type (and the evidence-gated `ToolGroup`
# rides the re-export surface) — L0 contracts, like flux-spec above.
flux-evidence.workspace = true
# `TurnStream` implements `futures::Stream` (the async-iterator shape of a live turn).
futures.workspace = true
# Optional (feature `pricing`): the `~/.flux/pricing.toml` loader behind `flux_sdk::pricing`, so a
# consumer gets `Session::cost` ergonomics without re-implementing the built-in-plus-overlay resolve.
# The provider-agnostic default build (`default = []`) pulls none of this.
flux-credentials = { workspace = true, optional = true }
# Optional (feature `providers`): the concrete LLM backends + the model-spec resolver behind
# `flux_sdk::providers`, so `providers::from_spec("claude/sonnet")` is a one-stop shop. The default
# build stays provider-agnostic (pulls neither this nor its transitive `flux-credentials`).
flux-providers = { workspace = true, optional = true }
# Optional (feature `plugins`): subprocess plugin tools behind `flux_sdk::plugins`, so an installed
# plugin's operations become policy-gated tools inside an embedded agent. Off by default.
flux-plugin = { workspace = true, optional = true }

[features]
default = []
# `flux_sdk::pricing::load_pricing_table()` — the built-in rate table overlaid by the user's
# `~/.flux/pricing.toml`, for `Session::cost`.
pricing = ["dep:flux-credentials"]
# `flux_sdk::providers::{*, from_spec}` — re-export the concrete backends and build a provider from a
# model spec (the CLI's exact resolver, incl. the claude/codex subscription token sources).
providers = ["dep:flux-providers"]
# `flux_sdk::plugins` + `FlowClient::register_plugin`/`ClientBuilder::with_plugin_tools` — load an
# installed subprocess plugin's operations as policy-gated tools.
plugins = ["dep:flux-plugin"]

# A minimal fixture plugin (echo/`upper`) for the `plugins` integration test — a real subprocess so
# `tests/plugins.rs` can exercise `register_plugin` end-to-end. `required-features` keeps it out of
# every default build; the custom path keeps it out of autobin discovery (flux-sdk stays lib-only by
# default).
[[bin]]
name = "flux_sdk_plugin_fixture"
path = "fixtures/plugin_fixture.rs"
required-features = ["plugins"]

[dev-dependencies]
# L5 web + datasource/RAG capabilities — a dev-only dependency for the `datasource_recipe` example
# (D-159): it shows how an EMBEDDER attaches datasources today via `register_pack`, so `flux-sdk`
# itself stays free of the dependency until the first-class seam lands (D-62).
flux-capabilities.workspace = true
