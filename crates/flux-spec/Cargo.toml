[package]
name = "codewandler-flux-spec"
edition.workspace = true
# PROTOCOL LINE (C-143), not the flux workspace version: the operation/tool vocabulary the plugin wire carries (Effect, Risk, Idempotency, StagingDisposition, FlowEffect),
# so a plugin built against 1.x keeps resolving across flux releases. Moves only when the
# wire vocabulary changes — scripts/cut-release.sh never touches it.
version = "1.3.0"
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "flux tool/operation specs: JSON-schema I/O, effects, risk, idempotency, access, and pre-execution intent (pure)"

[lib]
name = "flux_spec"

[dependencies]
# `FlowEffect::lower` maps a semantic effect onto the policy `Action` it requires. flux-policy is
# an L0 serde-only leaf, so the wire vocabulary stays cheap for guest plugins (C-141).
flux-policy.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
