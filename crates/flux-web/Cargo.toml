[package]
name = "codewandler-flux-web"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "flux native web capabilities: arbitrary HTTP (http.request), readable-markdown fetch, and non-visual browser use — all under one scoped `web` egress policy"

[dependencies]
flux-core.workspace = true
flux-runtime.workspace = true
flux-spec.workspace = true
flux-system.workspace = true
# For the shared `EgressAudit` seam (a `PrivateNetAdmit` is emitted when a request is admitted to a
# private host under a grant). flux-plugin is L4; flux-web is L5, so this respects layering — the
# same reuse flux-capabilities already makes for the endpoint broker.
flux-plugin.workspace = true
# The markdown engine (L0): flux-web builds a markdown AST from parsed HTML and renders it with the
# writer. flux-markdown stays a pure markdown engine — the HTML parser lives here, not there.
flux-markdown.workspace = true
# The datasource record contract (L0): fetched pages are contributed as `web.page` records.
flux-datasource.workspace = true
# The evidence-gated ToolGroup (L0): the `browser` group surfaced by a Chromium-discoverable signal.
flux-evidence.workspace = true
reqwest.workspace = true
url.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
# The async CDP client (tier 3) drives the browser over a `\0`-framed pipe: tokio IO + sync + tasks.
tokio.workspace = true
# HTML parsing for the tier-2 condenser (the html5ever family). The dep lands in flux-web — not
# flux-markdown — so the markdown engine stays parser-free. Pure Rust; build-weight measured in D-120.
scraper = "0.27"
# Pure-Rust PDF text extraction (D-161): `web.fetch` returns extracted text for PDF responses instead
# of a raw lossy byte dump. No native pdfium / C deps — it walks the PDF with `lopdf` + font parsers.
pdf-extract = "0.12.0"

[dev-dependencies]
tokio.workspace = true
flux-policy.workspace = true
# Builds the tiny valid fixture PDFs the `web.fetch` extraction tests serve. `default-features = false`
# keeps the (already-transitive, via pdf-extract) `lopdf` free of the date/image extras for tests.
lopdf = { version = "0.44", default-features = false }
