[package]
name = "codewandler-flux-app"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "flux-app: the L6 runtime host that runs a multi-agent flux Program (event bus + triggers + journeys)"
repository.workspace = true

[lib]
name = "flux_app"

[dependencies]
flux-core.workspace = true
flux-spec.workspace = true
flux-lang.workspace = true
flux-flow.workspace = true
flux-agent.workspace = true
# The embedded SQLite backend is asked for explicitly: the workspace entry turns default
# features off so flux-flow can shed the driver (C-274) — see the root Cargo.toml.
flux-events = { workspace = true, features = ["sqlite"] }
flux-runtime.workspace = true
flux-tools.workspace = true
flux-orchestrate.workspace = true
flux-provider.workspace = true
flux-evidence.workspace = true
flux-system.workspace = true
flux-cognition.workspace = true
flux-secret.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "io-std", "io-util"] }
tokio-util.workspace = true
futures.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
flux-policy.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
# L6→L6 (flux-sdk), test-only: dev-dependencies don't constrain flux-codegate's layering check.
# Used by the L-13 same-report test to drive the direct FlowClient path alongside App::deliver.
flux-sdk.workspace = true
