[package]
name = "flux-cli"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "the flux binary — the LLM plans, the runtime runs: compile a request into a deterministic Flux-Lang plan and execute it through the safety envelope"

[[bin]]
name = "flux"
path = "src/main.rs"

[dependencies]
flux-core.workspace = true
flux-provider.workspace = true
flux-providers.workspace = true
flux-credentials.workspace = true
flux-runtime.workspace = true
flux-spec.workspace = true
flux-config.workspace = true
flux-policy.workspace = true
flux-auth.workspace = true
flux-secret.workspace = true
flux-evidence.workspace = true
flux-system.workspace = true
flux-tools.workspace = true
# The embedded SQLite backend is asked for explicitly: the workspace entry turns default
# features off so flux-flow can shed the driver (C-274) — see the root Cargo.toml.
flux-events = { workspace = true, features = ["sqlite"] }
flux-agent.workspace = true
flux-flow.workspace = true
flux-lang.workspace = true
flux-cognition.workspace = true
flux-app.workspace = true
flux-channels.workspace = true
flux-eval.workspace = true
flux-orchestrate.workspace = true
flux-a2a.workspace = true
flux-server = { workspace = true, features = ["introspect"] }
flux-tui.workspace = true
flux-capabilities.workspace = true
flux-web.workspace = true
flux-datasource.workspace = true
flux-plugin.workspace = true
flux-skill.workspace = true
flux-sdk = { workspace = true, features = ["test-kit"] }
tokio.workspace = true
tokio-util.workspace = true
futures.workspace = true
clap.workspace = true
clap_complete.workspace = true
anyhow.workspace = true
async-trait.workspace = true
crossterm.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
serde_norway.workspace = true
rusqlite.workspace = true
chrono.workspace = true
reedline = "0.49.0"
# Restore the default SIGPIPE disposition at startup so piping into `head`/`less` ends the process
# quietly instead of panicking on EPIPE (A-61). A no-op on non-unix; usage is `#[cfg(unix)]`-gated.
libc = "0.2"
# Hidden password prompt for `flux auth login <plugin> --password` (plugin-oauth, D-82).
rpassword = "7"
flux-markdown = { workspace = true, features = ["terminal"] }
# Only pulled in with the `slack` feature, to install a process-level rustls crypto provider in `main`
# (the slack dep tree enables BOTH aws-lc-rs and ring, so rustls can't auto-pick one on its own).
rustls = { version = "0.23", optional = true }

[features]
# The Slack channel adapter is compiled in by default so `channel slack` programs run on the stock
# binary. It pulls the slack-morphism socket-mode dep (and, via `dep:rustls`, a process-level crypto
# provider — see the `rustls` dep note above). Drop it with `cargo build -p flux-cli --no-default-features`.
default = ["slack", "png"]
slack = ["flux-channels/slack", "dep:rustls"]
# PNG output for `flux render -o out.png` (L-78) — the resvg/usvg rasterizer stack behind
# flux-tools' `png` feature. Default-on so the stock binary (and `task install`, which is
# `cargo install --path crates/flux-cli`) renders PNGs; drop with --no-default-features.
png = ["flux-tools/png"]
# Wire the semantic/embeddings datasource backend (the agent's `search` blends keyword + embeddings).
# Off by default; needs an embeddings API key at runtime (see flux-capabilities `OpenAiEmbedder`).
embeddings = ["flux-capabilities/embeddings"]

[dev-dependencies]
jsonschema.workspace = true
syn.workspace = true
toml.workspace = true
