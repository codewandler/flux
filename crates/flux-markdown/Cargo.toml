[package]
name = "codewandler-flux-markdown"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "flux's own markdown engine: frontmatter parsing plus an AST-based CommonMark-subset parser, writer, and (feature-gated) ratatui/terminal renderers"

[lib]
name = "flux_markdown"

[dependencies]
serde.workspace = true
serde_norway.workspace = true

# Render-path extras — off by default so the L0 parser/AST half stays pure std. The parser itself
# has NO external dependency (it is flux's own engine, L-02); these only style/measure its output.
ratatui = { workspace = true, optional = true }
unicode-width = { version = "0.2", optional = true }

[dev-dependencies]
# Self-dependency trick: enables both render features for this crate's own tests, so a bare
# `cargo test -p flux-markdown` exercises the render paths without feature flags.
flux-markdown = { path = ".", package = "codewandler-flux-markdown", features = ["ratatui", "terminal"] }
# The replaced wrapper crates, kept ONLY as parity oracles for tests. Dev-only — not in the publish
# closure, ignored by codegate. This first-party revision aligns markdown-ratatui with ratatui 0.30.
markdown-stream = { package = "codewandler-markdown-stream", git = "https://github.com/codewandler/markdown", rev = "ad16fe51f9a98e65037af14f2bcd36c62b252d80" }
markdown-ratatui = { package = "codewandler-markdown-ratatui", git = "https://github.com/codewandler/markdown", rev = "ad16fe51f9a98e65037af14f2bcd36c62b252d80" }
markdown-terminal = { package = "codewandler-markdown-terminal", git = "https://github.com/codewandler/markdown", rev = "ad16fe51f9a98e65037af14f2bcd36c62b252d80" }

[features]
default = []
# Native render to ratatui `Text` (used by flux-tui).
ratatui = ["dep:ratatui", "dep:unicode-width"]
# ANSI terminal rendering incl. the streaming `LiveRenderer` (used by flux-cli's sinks).
terminal = ["dep:unicode-width"]
