# A well-formed connector manifest, as `connector-cli`'s seam emitter writes one — the servable
# shape: `transport = "webhook"` with `verification.kind = "none"` (the vendor publishes no
# signature, stated deliberately rather than omitted).
#
# Kept in this repository on purpose: the flux test suite must never reach into flux-connectors, so
# a change over there cannot turn this suite red without anyone deciding it should.
generator = "flux-connectors 0.6.0"
connector = "acme"
gid = "com.acme.api:v1"
vendor = "Acme"
description = "Acme messaging"
base_url = "https://api.acme.example"
api_version = "v1"
module = "acme.flux"
operations = ["acme-messages-post"]

[[events]]
name = "mention"
oip = "com.acme.api:v1#mention"
description = "Someone mentioned the app"
group = "Messages"

[[events]]
name = "reaction"
oip = "com.acme.api:v1#reaction"
description = "Someone reacted to a message"
group = "Messages"

[[channels]]
name = "events-api"
oip = "com.acme.api:v1#events-api"
description = "Acme POSTs to an endpoint the operator exposes. It publishes no signature"
transport = "webhook"
events = ["mention", "reaction"]

[channels.verification]
kind = "none"
verified = false

[channels.discriminator]
source = "body"
name = "event.type"

[channels.delivery_id]
source = "body"
name = "event_id"

[channels.payload]
channel = "event.channel"
text = "event.text"
user = "event.user"

[channels.reply]
operation = "acme-messages-post"
oip = "com.acme.api:v1#acme-messages-post"
result = "text"

[channels.reply.bind]
channel = "channel"
