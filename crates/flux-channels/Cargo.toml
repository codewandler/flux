[package]
name = "flux-channels"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "flux event-trigger channels: cron/webhook/Slack adapters that wake a flux-app program's journeys on external events"

[dependencies]
flux-app.workspace = true
flux-core.workspace = true
flux-credentials.workspace = true
flux-flow.workspace = true
flux-server = { workspace = true, features = ["introspect"] }
flux-lang.workspace = true
tokio.workspace = true
tokio-util.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
axum.workspace = true
cron.workspace = true
chrono.workspace = true
slack-morphism = { workspace = true, optional = true }

[features]
# The Slack socket-mode adapter. slack-morphism's `hyper` feature pulls its hyper/tungstenite connector
# only — its optional axum integration stays off (harmless either way: its axum is 0.8, same as ours).
slack = ["dep:slack-morphism", "slack-morphism/hyper"]

[dev-dependencies]
tokio.workspace = true
tower = { version = "0.5", features = ["util"] }
