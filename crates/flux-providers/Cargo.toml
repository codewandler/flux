[package]
name = "codewandler-flux-providers"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "flux's concrete LLM providers — the shared Anthropic Messages protocol core plus the Anthropic, OpenAI, OpenRouter, and Ollama wire codecs/credentials (built on the flux-provider abstraction)"

[lib]
name = "flux_providers"

[dependencies]
flux-core.workspace = true
flux-provider.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
futures.workspace = true
async-stream.workspace = true
eventsource-stream.workspace = true
bytes.workspace = true
reqwest.workspace = true
tracing.workspace = true

# AWS Bedrock SigV4 signing (hand-rolled — HMAC-SHA256 over the canonical request) and the
# event-stream chunk payloads (`{"bytes":"<base64>"}`); base64 also serves realtime audio.
sha2.workspace = true
hmac.workspace = true
hex.workspace = true
sha1 = "0.10"
chrono.workspace = true
base64.workspace = true

# WebSocket transport — always on: the `codex` provider speaks WS as its primary transport
# (C-07), including the bounded first-frame connect timeout (C-28, needs `tokio::time`); the
# realtime (voice-to-voice) provider reuses the WS transport behind the `realtime` feature.
tokio-tungstenite.workspace = true
tokio.workspace = true

# Realtime (voice-to-voice) provider extras, off by default so the HTTP family stays lean.
tokio-util = { workspace = true, optional = true }

[features]
# The OpenAI Realtime (full-duplex, voice-to-voice) provider.
realtime = ["dep:tokio-util"]
